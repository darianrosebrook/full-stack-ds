invariants:
  - 'Accessibility cases describe semantic obligations a lawful projection must preserve. ARIA, HTML and APG details are EVIDENCE for those obligations, cited per case, never vocabulary admitted into the analytical relation: no aria/role/html namespace may enter vocabulary.json.'
  - 'No stage-1 behaviour change. engines.ts, relation-model.ts, judgment.ts, structure.ts, the fixtures, witnesses.json and removals.json are scope.out; the stage-1 adjudicable set stays 19 cases over 15 diagnostics, the holdout ruleDigest stays 6b7b2135, and stage1.test.ts plus necessity.test.ts pass unmodified.'
  - 'Oracle extension only: this slice implements no engine rule for the new obligations. A new case confers an obligation on a later stage, never a passing behaviour now.'
  - 'Every case that declares a projection-conservation term must cite at least one external source with its normative-vs-guidance status; corpus-integrity refuses an uncited one.'
acceptance:
