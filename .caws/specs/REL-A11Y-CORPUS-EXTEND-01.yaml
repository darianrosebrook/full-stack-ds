    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the corpus carries one accessibility case at stage 5; when cases are added across information, order, structure, interaction and representation-independence conservation; then each names the standard that licenses it and its stage is the earliest stage whose facts decide it'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given ARIA and APG are external evidence; when the new cases are written; then no aria/role/html term enters vocabulary.json and the form-name denylist still reports no leak'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given corpus-integrity requires catalogue-case bijection; when new diagnostics are added; then the doctrine catalogue and the illegal-case diagnostic set are equal in both directions and every engine stays exercised'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a stage-2 case must be adjudicable at stage 2; when checkLedger runs at stage 2; then each new stage-2 case reports LEDGER_CASE_UNBOUND as an obligation for REL-VIEW-ALGEBRA-01 rather than passing silently'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the oracle changes; when the slice closes; then a new custody baseline is recorded for corpus.jsonl, corpus-case.schema.json, vocabulary.json, form-names.json and the doctrine catalogue plus appendix'
