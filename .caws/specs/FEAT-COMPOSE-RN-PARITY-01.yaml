invariants:
  - 'The static-content gate is a mirror of the swift classifier — same shared IR shape facts (surface/channels/instance-children/root-tag, children-leaf or decorative box), zero per-component names; a corpus addition routes through it automatically or throws loudly, never silently misroutes.'
  - 'Token scopes come from the same ComponentIR.tokenScopes the web/RN/swift emitters consume — the Compose tokens emitter is shape-agnostic (walks ir.tokenScopes), so admitted components carry FULL scopes, never a consumed subset.'
  - 'The parity ratchet is two-directional: a Compose scope diverging from RN fails, and an RN scope entry with no Compose counterpart fails — the gate cannot be satisfied by hiding one side.'
  - 'The Compose FsdsTheme chain resolves every admitted slot (slot-name override -> semantic-ref -> literal -> fallback, mirroring RN); zero unresolvable slots in the batch.'
  - 'Native-collapse and projected-children paths are unchanged; the static-content path dispatches before the shape throw.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the Compose emitter; when a static-content IR shape is emitted; then it lowers through a new static-content path (mirror of the swift gate: no surface/channels/instance children/button|input|img root, single children leaf or decorative box) with NO component-name lore, and every static-content corpus component emits .kt plus full TokenScopes.kt without throwing'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the static batch; when the allowlist admits them; then fsds.targets.json lists them, generation succeeds, and the gradle library plus settings-example lane compile green (compose admission 3 -> 16)'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the generated trees; when scripts/compose-parity-diff.mjs runs; then every compose-admitted component''s generated scope cssVar set equals the RN component''s scope cssVar set (identical sets per component) and the script exits nonzero on any divergence — the two-directional token-usage parity ratchet'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the admitted batch; when the gate inspects each scope entry; then every entry carries a resolvable ref or literal+fallback that the Compose FsdsTheme chain (slot-name -> semantic-ref -> literal -> fallback) resolves — zero unresolvable slots'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the parity gate; when CI and pre-push run; then the compose-parity check is wired into the generated-drift family so token-scope parity cannot silently rot'
non_functional: {}
contracts:
  - name: 'static-content-class'
    type: behavior
    path: 'packages/ds-contracts/components/Text/Text.contract.json'
