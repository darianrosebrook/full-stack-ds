invariants:
  - 'The audit derives its denominator from the contracts-fs corpus walk and tokens sidecars, never from a hardcoded component list.'
  - 'Every gap between a declared slot and a native carrier realization is either fixed or ledgered with a disposition; new unledgered gaps fail the audit.'
  - 'Ledgered gaps that get fixed go stale and fail until removed, so the ledger cannot rot.'
  - 'The audit is read-only: it changes no contract, token, or generated artifact.'
acceptance:
