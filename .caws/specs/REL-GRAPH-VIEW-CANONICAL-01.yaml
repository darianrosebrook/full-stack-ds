invariants:
  - 'THE DECISION, recorded: a canonical GRAPH-VIEW declaration with a GRAPH-VALUED result, alongside the existing relation-valued derivations. The existing graph derivation retains its documented edge-relation meaning; no nodeRelation operand is added to it, because the result object cannot be described as the old edge relation with one more validated input when its node population can change while the edge relation, its endpoint fields and its grain stay fixed.'
  - 'THE DECISIVE PAIR ENTERS THROUGH THE CANONICAL PATH. A test that hand-builds a declaration while the emitted schema is checked separately does not establish authorability, so the source-selection pair is parsed from the authored file through the loader and its OUTPUTS are observed.'
  - 'New declaration coordinates are accounted for explicitly. The graph-view family is its own identity with its own digest, so existing identities and their ledger stamps do not move; adding a canonical declaration is NOT retrospective ratification of stage 2, and preserving the existing unresolved count is not proof that the extension''s accounting is complete.'
  - 'Boundaries that must not be promoted: the key check establishes that the field carries key: true, NOT that every supplied identity is unique, and it is not a general source-key integrity proof. The supplied arrays are the selected populations for a snapshot; how a partially fetched population should be interpreted is NOT established, and ''not observed yet'' is not silently read as ''outside the universe''.'
  - 'Out of scope: layouts, general graph algorithms, arbitrary multigraph support, new projection families, closing the stage-2 census, and any redesign of the derivation algebra into a graph-valued one.'
