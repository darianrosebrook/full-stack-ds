id: REL-FIELD-ALGEBRA-01
title: 'Stage 1: the smallest executable representation of analytical data that distinguishes exactly the stage-1 cases'
risk_tier: 3
mode: feature
lifecycle_state: draft
created_at: '2026-09-02T20:15:21.847Z'
updated_at: '2026-09-02T20:15:21.847Z'
blast_radius:
  modules:
    - 'packages/ds-contracts/relation.contract.schema.json (relational structure: named relations with identity and declared relationships)'
    - 'packages/ds-codegen/src/analytical (L0-L2 types, the three checkability engines, the judgment, executable case bindings)'
    - 'packages/ds-contracts/analytical-pack (stage-1 fixtures, corpus-legal.jsonl, binding ledger)'
    - 'docs/architecture/analytical-relation-doctrine.md (stage-1 row: judgment shape, corpus blindness, executable bindings, discharge triad)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-contracts/analytical-pack'
    - 'packages/ds-contracts/relations'
    - 'packages/ds-contracts/relation.contract.schema.json'
    - 'packages/ds-contracts/package.json'
    - 'packages/ds-codegen/src/analytical'
    - 'docs/architecture'
  out: []
invariants:
  - 'The engine is blind to the corpus: production code under packages/ds-codegen/src/analytical, excluding corpus-integrity and tests, has no import of corpus.jsonl, corpus-integrity, or any CASE_ identifier and receives only a typed relational structure, an operation, and available evidence; a source-level negative test pins this and fails on an injected reference.'
  - 'A judgment is a set of diagnostics plus a set of obligations, with the three-valued status derived afterward: any proven illegality is illegal; otherwise outstanding obligations is unproven; otherwise admissible. No first-match precedence; a mixed-fault fixture pins order independence.'
  - 'Every stage-1 obligation is exercised three ways: absent evidence yields the named obligation, satisfying evidence discharges it, hostile evidence discharges it into a specific illegality.'
  - 'No L3 derivation typing, geometry, projection, or combinator semantics enter the engine to satisfy a later-stage case; the relational structure is a container of named relations with identity and declared relationships and nothing more.'
  - 'The 15 stage-1 diagnostics are a hypothesis, not a quota: an undercount or overcount stops the slice and is adjudicated in the doctrine, never patched around.'
acceptance:
  - id: A1
    given: 'the engine sources'
    when: 'the corpus-independence scan runs'
    then: 'no reference to corpus.jsonl, corpus-integrity, CASE_ identifiers, or expected verdict metadata exists outside tests, and the scan fails on an injected import (self-check)'
  - id: A2
    given: 'the 19 stage-1 cases from casesAdjudicableAt(1)'
    when: 'the binding ledger is checked'
    then: 'each case binds to exactly one structured fixture (relational structure + operation + evidence) and no fixture is orphaned, enforced by corpus-integrity in both directions'
  - id: A3
    given: 'the bound fixtures'
    when: 'the engine judges them blind'
    then: 'every illegal case yields its expected diagnostic, every unproven case its expected obligation, and the distinct diagnostics emitted over stage-1 cases equal the catalogue''s 15; any mismatch is recorded as a doctrine adjudication, not a code patch'
  - id: A4
    given: 'a heterogeneous fixture carrying an unknown premise and an independently provable illegality'
    when: 'judged'
    then: 'status is illegal with the obligation still listed, and permuting rule or source order does not change the result'
  - id: A5
    given: 'each stage-1 obligation (grain:declared, unit:commensurable, null:missing-mechanism)'
    when: 'run with absent, satisfying, and hostile evidence'
    then: 'the results are the named obligation, admissible, and a specific illegality respectively'
  - id: A6
    given: 'corpus-legal.jsonl plus a holdout set authored after the rules'
    when: 'judged'
    then: 'every case is admissible with empty diagnostics and obligations, so a reject-everything engine fails'
  - id: A7
    given: 'a single relation, an OHLC-shaped relation, a hierarchy-shaped relation, and a two-relation node/edge structure with an isolated node'
    when: 'expressed in relation.contract.schema.json'
    then: 'all validate without a form-specific field and the isolated node is representable'
  - id: A8
    given: 'the doctrine'
    when: 'the slice lands'
    then: 'its stage-1 row records the judgment shape, corpus blindness, executable bindings, and discharge triad; necessity ablations and the scale-as-alias minimization are explicitly deferred to REL-FIELD-ALGEBRA-02, and status stays draft until that lands'
non_functional: {}
contracts:
  - name: 'relational-structure-schema'
    type: schema
    path: 'packages/ds-contracts/relation.contract.schema.json'
  - name: 'analytical-judgment'
    type: behavior
    path: 'packages/ds-codegen/src/analytical/judgment.ts'
  - name: 'stage1-oracle'
    type: contract-test
    path: 'packages/ds-codegen/src/analytical/stage1.test.ts'
