id: TEST-SWIFTUI-RUNTIME-BREADTH-01
title: 'Extend SwiftUI runtime proof across the interactive corpus and token painting'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: swiftui-runtime-breadth
created_at: '2026-08-17T16:41:12.801Z'
updated_at: '2026-08-17T16:52:19.986Z'
blast_radius:
  modules:
    - 'packages/ds-swiftui/Tests/PressProofHarness/main.swift (new interaction phases)'
    - 'packages/ds-swiftui/Tests/DsSwiftUITests (new token-paint test file)'
    - 'docs/current-implementation-snapshot.md'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-swiftui'
    - 'docs/current-implementation-snapshot.md'
    - packages/ds-codegen
  out: []
invariants:
  - 'The harness composes only public component inits and asserts only observable channels/counters; it never invokes callbacks directly, never mutates view internals, and actuates solely through OS-mediated paths (AXPress; AXValue/keyboard for text entry where a press cannot type)'
  - 'Token-paint expectations are read from the committed resolved token graph (resolved.tokens.json), never hand-copied literals; the assertion chain is component token-scope binding to resolved value to sampled pixel'
  - 'No phase may silently skip: a surface unreachable via AX on this host must print a LIMITATION artifact and is excluded from exit-code aggregation only with that evidence in the phase output; a phase producing no artifact at all fails the run'
acceptance:
  - id: A1
    given: 'the press-proof harness extended with phases composing Dialog, Select, Tabs, Accordion, Shuttle, Calendar, Switch, and OTP via their public inits in a real App window'
    when: 'the harness runs and actuates each surface through the OS accessibility path (AXPress, AXValue for OTP entry) and the runloop settles'
    then: 'every phase prints its counter/channel artifact matching contract expectations and the harness exits 0, or exits nonzero naming the failing phase and counter'
  - id: A2
    given: 'offscreen NSHostingView captures of token-scoped components in light and dark system appearances'
    when: 'rendered pixels are sampled and compared against expected values read from the committed resolved token graph'
    then: 'sampled colors match resolved token values including the adaptive dark flip, or the test fails naming component, token, expected, and actual'
  - id: A3
    given: 'the full worktree gate suite'
    when: 'all gates run inside the bound worktree'
    then: 'green (rail, root+framework tests, swift build/test, parity fixture) and the harness remains a test-only executable outside the component allowlist'
non_functional: {}
contracts:
  - name: 'swiftui-runtime-proof-breadth'
    type: behavior
    path: 'packages/ds-swiftui/Tests/PressProofHarness/main.swift'
