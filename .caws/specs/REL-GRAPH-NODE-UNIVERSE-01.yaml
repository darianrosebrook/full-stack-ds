invariants:
  - 'The node universe is DECLARED, never inferred. A consumer must not derive the node population from edge endpoints, and must not infer the binding from fields that happen to be named id, src and dst. The declaration is validated against the structure before any representation exists.'
  - 'The decisive pair is two structures with an IDENTICAL edge relation and different declared node populations. A representation that reconstructs nodes from edge endpoints collapses them, and that collapse is exhibited rather than asserted.'
  - 'The identity-preserving mutation replaces the isolated node identity while keeping the node count and the edge set. Recovery must detect the wrong IDENTITY; agreement on three nodes and one edge is not sufficient.'
  - 'The authority''s own graph operand declares no node relation, and that absence is recorded as the residual rather than repaired here: this slice declares the binding as an explicit validated premise, it does not extend the zod model, and it does not touch schema emission or the stage-2 ledgers.'
  - 'No layout, marks, interaction, accessibility implementation, general combinators, or redesign of the analytical algebra. A requirement for any of those is a stopping finding.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given two structures whose edge relation is identical and whose declared node populations differ by one isolated node; when the node universe is declared as a binding, validated against the structure, and carried through two produced representations; then both representations recover the exact node identities and the incidence, the two structures are distinguished, and a representation that derives nodes from edge endpoints is shown to collapse them'
non_functional: {}
