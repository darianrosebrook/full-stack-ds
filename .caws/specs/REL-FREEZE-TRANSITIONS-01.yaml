acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an authored transition whose identities, predecessor endpoints and successor endpoints exactly match the measured movement; when the record is taken with it; then it is accepted'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an authored transition with one altered successor endpoint; when validated; then it is refused'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a movement that includes an authority the authored transition does not explain; when validated; then it is refused'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an authored transition reused against a later different multi-authority movement; when validated; then it is refused'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a plain re-record with no new authority movement; when taken; then the prior transition is carried as historical provenance'
