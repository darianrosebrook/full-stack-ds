invariants:
  - 'THE PROJECTION LAYER CONSUMES THE RESULT, NOT THE BINDING. enumerateGraph receives a denoted GraphResult and never a GraphBinding, so it cannot re-resolve a relation name or re-select a population. If it could, M1''s exit would be nominal.'
  - 'MILESTONE 1 EXIT, scoped honestly: the graph path reaches the enumerator for the task a graph serves (topology), judged from the graph-valued result and the target inventory. It does NOT claim a complete topology algebra, a layout, or that every topology candidate is enumerated.'
  - 'Missing versus explicitly empty population must be DISTINGUISHED AND TESTED: empty nodes with empty edges denotes an empty graph; empty nodes with non-empty edges is refused. Only the missing case has been tested so far.'
  - 'The binding mutant must leave DESCRIPTIVE METADATA UNCHANGED: force the node-row read to ignore the binding so the result is wrong while the reported selection still names the declared relation. Outcome-only checks are not sufficient.'
  - 'Necessity/accounting for the graph-view coordinates is NOT discharged here and must be recorded as the remaining M1 item rather than implied by schema acceptance.'
  - 'Stage-2 ratification is untouched: no census coordinate is adjudicated, the subtraction keeps its existing unresolved count, and no existing ledger is re-recorded.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a graph-valued result denoted from a canonical graph-view declaration; when the projection layer enumerates candidates for the task a graph serves; then the candidates are judged from the graph result and the target inventory without the enumerator re-resolving a source relation or consulting a second declaration, and the empty-versus-missing and metadata-preserving-mutant controls separate success from the plausible false pass'
  - id: A2
    given: 'A graph-valued result has been denoted.'
    when: 'The enumerator is asked for candidates serving the task a graph serves.'
    then: >-
      Candidates are judged from the graph result and the target inventory alone,
      the domain restriction that excludes positional coordinates is stated rather
      than reported as no lawful projection, and the relation path still admits
      nothing for that task.
non_functional: {}
