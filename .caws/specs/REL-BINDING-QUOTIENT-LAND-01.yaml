invariants:
  - 'The incidence erasure must leave a legal DECLARATION wherever the boundary must resolve the reference: rewriting a bound reference to reserved tokens abandons resolution, so the quotient is the corruption rather than an ablation and no corpus can repair it.'
  - 'The namespace a bound reference ranges over is a DECLARATION fact, not something the executor infers from a path: the operands carry it, the walk reads it, and a reference that carries no namespace keeps the tokenizing erasure unchanged.'
  - 'Replacing an erasure changes what every recorded footprint, freeze entry and legacy comparison was measured over, so all three ledgers are re-recorded under the moved erasure authority and the pins that named the OLD refusal are corrected rather than deleted.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the incidence erasure at a derivation operand rewrites names to reserved tokens, which the boundary refuses, so eighteen coordinates can never be witnessed; when the operand namespace is declared on the derivation operands and the executor rebinds the slot to declared names from that namespace; then every image is a legal declaration, the coordinates whose binding is written once stop being refused while the two-sided ones stay refused for the mirror reason, and the analytical suite, every gate and every ledger agree with the new erasure'
non_functional: {}
contracts:
  - name: 'binding-erasure'
