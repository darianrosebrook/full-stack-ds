invariants:
  - 'Oracle frozen at the post-rename baseline: analytical-pack is scope.out and closure must show corpus.jsonl 6f8edea4f5aabef4, corpus-case.schema.json 0b02d6eedcc3cfd4, vocabulary.json ba144b63b34c2371, form-names.json 0564902cf8d7d4ff, doctrine catalogue+appendix sections (sed ''## Diagnostic catalogue''..''## Falsification conditions'') 8622d010f131c94f unchanged. If the harness proves the oracle wrong the slice stops untouched.'
  - 'Two phases with a frozen intermediate baseline. Phase A (baseline repair) ends by committing a baseline record: sha256 of the zod model, the emitted schemas, engines.ts, fixtures.jsonl, bindings.json, and the canonical judgment ledger of every fixture and holdout item. Phase B may change the engine, grammar or fixtures ONLY to remove not-yet-admitted coordinates, and every removal is followed by a conservation rerun that must equal the ledger byte-for-byte.'
  - 'Single schema authority: one zod model is the only hand-authored description of the relational structure and the assertion grammar; TypeScript types are inferred from it; relation.contract.schema.json and assertion.schema.json are emitted from it and drift-gated (check mode wired to pre-push and CI); consumers read the JSON and never import zod.'
  - 'Separating-set maximum is 2, fixed here before any ablation runs. A coordinate whose necessity needs a set of 3 or more stops the slice as a falsification of the factoring; the bound is never relaxed and no member is declared individually necessary to rescue it.'
  - 'Census granularity: independently variable schema leaves, assertion-grammar leaves, and enum-member distinctions, each appearing exactly once in a machine-readable census DERIVED from the zod model, so a parent axis cannot survive on one witness while carrying unnecessary children.'
  - 'Witnesses are representational and oracle-adjudicated. A witness for coordinate set X is a pair (A,B) whose required outcomes differ by the oracle (a corpus verdict, a legal neighbour admissible by construction, or a hand-adjudicated pair recorded before the harness runs) and whose erasures Q_X(A) and Q_X(B) are byte-identical; for |X|=2 both single erasures must fail to collide. Engine output is never a required outcome; the engine ledger is used only for conservation.'
  - 'Coordinate states are exactly ratified or not-yet-admitted. Not-yet-admitted coordinates are removed from the kernel in this slice and recorded with the earliest later stage allowed to re-earn them with its own witness. There is no speculative-retention state.'
  - 'Occurrence identity carries the complete assertion identity (kind, op, sorted along/toGrain, nulls, uncertainty) as the occurrence key and the emitting engine as provenance; subject stays the analytical locus and is not overloaded as the key. For every stage-1 oracle case the emitting engine equals the corpus engine field.'
  - 'The two row-reading branches that emit stage-2 catalogue codes (REL_GRAIN_FANOUT, REL_NULL_SUPPRESSED_AS_ZERO) stay executable but are classified instance-evidence behaviour in the census; they confer no stage-1 schema necessity and their coordinates need their own witnesses like any other.'
  - 'The ablation harness is external to the representation it minimizes and is itself falsified: it must reject a pair that does not collide under the claimed erasure, a 2-set whose single erasures already collide, and an erasure that only produces schema invalidity.'
  - 'D6 is a frozen two-candidate comparison: authored scale identity versus a capability basis precommitted here (admissible transformation class, order structure, zero/reference semantics, cyclicity, discreteness, bounded whole). decode(scale)->capabilities must reproduce every stage-1 judgment and holdout item exactly; exactly one authority survives in the model (scale primitive with capabilities derived, or capabilities primitive with scale labels as derived aliases). Both are never left authoritative.'
  - 'Promotion is bounded: PASS flips the doctrine to active with the ratification scoped to ''the L0-L2 kernel survives construction and subtraction''; it does not claim the analytical normal-form candidate (end of stage 3), projection completeness, or the FSDS thesis.'
  - 'Exactly four closure outcomes: PASS; UNNECESSARY COORDINATES FOUND (remove, rerun baseline, pass if conservation holds); >2-AXIS DEPENDENCY FOUND (stop; factoring falsified); FUTURE-ONLY COORDINATE FOUND (remove from the kernel; record the reintroducing stage). Outcomes 2 and 4 are expected results, not failures. Nothing is patched around.'
  - 'The showcase fixture dump under src/data/analytical-fixtures is a derived artifact: fixtures:sync --check fails on drift, is wired into the pre-push scope for analytical-fixtures changes, and the dump is re-synced in this slice after every fixture-schema change.'
acceptance:
  - id: A1
    given: 'Phase A complete'
    when: 'the baseline record (model, emitted schemas, engine, fixtures, bindings digests + canonical judgment ledger of all fixtures and holdout items) is committed'
    then: 'every later Phase-B commit touches only census, harness, witness, doctrine and removal files, and each removal commit''s conservation rerun equals the ledger byte-for-byte'
  - id: A2
    given: 'the zod model'
    when: 'the schema emitter runs in check mode'
    then: 'relation.contract.schema.json and assertion.schema.json are byte-identical to the emitted output, structure.ts declares no parallel hand-written type for anything the model describes, all fixtures validate exactly as before, and a mutated JSON file fails the check'
  - id: A3
    given: 'two assertions on one field differing only in along'
    when: 'judged'
    then: 'two occurrences with distinct identities and one subject; and for all 19 stage-1 cases the occurrence''s engine equals the corpus engine (the suppression obligation now emitted by declaration-missing)'
  - id: A4
    given: 'engines.ts changed in Phase A'
    when: 'the holdout is re-derived by hand'
    then: 'the new rule digest is recorded with its reason, every item is re-verified, and expectations change only where occurrence identity format changed'
  - id: A5
    given: 'the synced showcase dump'
    when: 'fixtures:sync --check runs on a mutated dump and on the synced one'
    then: 'non-zero then zero; and scripts/prepush-scope.mjs runs the check when analytical-fixtures changes'
  - id: A6
    given: 'the zod model'
    when: 'the census is derived'
    then: 'every schema leaf, assertion leaf and enum-member distinction appears exactly once, the two stage-2 row branches are marked instance-evidence, and a test proves a leaf added to the model appears in the census with no hand edit'
  - id: A7
    given: 'every coordinate in the census'
    when: 'the harness runs'
    then: 'each ratified coordinate has a recorded witness pair with oracle-required outcomes differing and byte-identical images under its erasure; each 2-set witness shows both single erasures non-colliding; no coordinate needs a 3+ set (else the slice stops)'
  - id: A8
    given: 'three pseudo-witnesses (non-colliding pair, non-minimal 2-set, schema-invalidity-only erasure)'
    when: 'fed to the harness'
    then: 'all three are rejected with a named reason'
  - id: A9
    given: 'coordinates with no witness'
    when: 'Phase B removes them from the model'
    then: 'the emitted schemas shrink accordingly, the record lists each removed coordinate with the earliest stage allowed to reintroduce it, fixtures are trimmed of removed leaves (never the oracle), and all fixtures re-validate'
  - id: A10
    given: 'all removals applied'
    when: 'the full analytical suite and the ledger comparison run'
    then: 'every test passes and the canonical judgment of every fixture and holdout item equals the frozen Phase-A ledger byte-for-byte'
  - id: A11
    given: 'the precommitted capability basis'
    when: 'decode(scale) is compared against authored scale over every stage-1 judgment and holdout item'
    then: 'it reproduces them exactly, the alias table (labels that collapse to one capability state) is recorded, and exactly one authority remains in the model'
  - id: A12
    given: 'closure'
    when: 'the five custody digests are recomputed'
    then: 'they equal the baseline values in invariant 1'
  - id: A13
    given: 'a PASS outcome'
    when: 'the doctrine is edited'
    then: 'status flips to active, the ratification paragraph names the L0-L2 kernel scope and the four outcomes, the stage-1.5 row records the census counts (ratified / removed / aliases), falsification condition 9 is discharged, and the catalogue+appendix digest is unchanged; on any other outcome status stays draft and the row records the outcome'
