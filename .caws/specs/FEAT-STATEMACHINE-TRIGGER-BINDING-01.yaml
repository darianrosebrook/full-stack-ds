invariants:
  - 'The rule is name-resolution only: a transition event must resolve to a declared referent (channel key, events key, prop name, dismissal trigger event, a11y.keyboard id, "<part>.<verb>" with part in anatomy.parts, or a member of the closed DOM platform set). It does not adjudicate trigger semantics, kinds, or ordering.'
  - 'The DOM platform event set is closed (animationend, transitionend) and grows only by demonstrated corpus need, mirroring the closed-projection doctrine.'
  - 'No component-source or behavior change: transition realization stays out of scope. The six rail-admitted generated trees are byte-identical; the one generated-output delta is the Figma descriptor''s faithful verbatim projection of the new a11y.keyboard id fields (Tabs.figma.json), which carries no realization semantics.'
  - 'Existing Rule 6 (from/to ⊆ states.dimensions) behavior is unchanged.'
  - 'Tabs keyboard id values exactly equal the transition event names they bind (arrow.next, arrow.prev, home, end).'
acceptance:
  - id: A1
    given: 'a contract whose stateMachine transition event resolves to no channel key, events key, prop name, dismissal trigger, a11y.keyboard id, part-qualified form, or closed DOM platform event'
    when: 'generate:check semantic validation runs'
    then: 'it fails with pointer /stateMachine/transitions/<i>/event and code STATEMACHINE_TRIGGER_UNRESOLVED'
  - id: A2
    given: 'the live corpus after Tabs keyboard entries gain stable interaction ids'
    when: 'pnpm run generate:check runs inside the spec worktree'
    then: 'it exits 0 with all 17 declared transition events resolving and no new issues'
  - id: A3
    given: 'the catalog mutant dialog-state-machine-open-event-reveal (event open to reveal) and the merged rule'
    when: 'the targeted full-profile mutation measurement runs at the committed HEAD'
    then: 'the mutant is detected at the structural stage and the catalog disposition records detected'
non_functional: {}
