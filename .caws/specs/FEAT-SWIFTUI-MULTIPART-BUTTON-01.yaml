invariants:
  - 'The multi-part path admits only a constrained, IR-described class: interactive trigger root whose dom children are solely a projected children region. Everything else throws — never a silent approximation.'
  - 'All styling facts come from ir.tokenScopes (RN normal form); the emitter invents no values, and non-parseable units (rem, cubic-bezier) are skipped with the gap documented rather than approximated.'
  - 'FsdsTheme.swift is hand-maintained runtime (RN tokens/index.tsx analog): override-by-name then literal/fallback resolution; components ship scope data, not resolved constants.'
  - 'SwiftUI reserved-type renames live in one emitter-owned table; no per-component branching.'
acceptance:
  - id: A1
    given: 'Button (no collapse intent, interactive root + projected children)'
    when: 'pnpm run generate -- --target=swiftui Button runs'
    then: 'the multi-part path emits a compiling FsdsButton and swift build exits 0 with Switch/ToggleSwitch/Stack output byte-stable'
  - id: A2
    given: 'the SwiftUI reserved-type table in the emitter'
    when: 'a component name collides with a SwiftUI type (Button)'
    then: 'the export is prefixed (FsdsButton) so consumers importing SwiftUI and DsSwiftUI see no ambiguity — grammar-level mapping, not component lore'
  - id: A3
    given: 'ir.tokenScopes'
    when: 'the component emits'
    then: 'it ships its scopes as generated ComponentTokenScopes data and resolves chrome through the hand-authored Tokens/FsdsTheme.swift module (environment-injected, override-then-fallback), layering root + variant_<size> + variant_<intent> and applying only slots that exist'
  - id: A4
    given: 'a contract outside the constrained multi-part class (Card: slot/compound children)'
    when: 'generation runs'
    then: 'the emitter still throws the explicit not-implemented anatomy error (fail-loud preserved; test negative control updated from Button to Card)'
  - id: A5
    given: 'the settings swift lane'
    when: 'rebuilt'
    then: 'Save profile and Delete account compose FsdsButton(variant:.primary/.destructive) and the lane compiles; lane + package READMEs and examples README non-claims updated'
  - id: A6
    given: 'the full worktree gate'
    when: 'governed:rail, pnpm test, test:frameworks run'
    then: 'all pass with committed-tree drift confined to packages/ds-swiftui and the swiftui emitter'
non_functional: {}
contracts:
  - name: 'swiftui-multipart-button'
    type: contract-test
    path: 'packages/ds-codegen/src/frameworks/swift/swiftui/component-source.test.ts'
