  modules:
    - 'packages/ds-codegen/src/frameworks/swift/swiftui/component-source.ts (multi-part path, reserved names, scope data)'
    - 'packages/ds-swiftui (Tokens/FsdsTheme.swift hand-maintained; generated FsdsButton + scope data)'
    - 'examples/settings/swift (FsdsButton consumption)'
