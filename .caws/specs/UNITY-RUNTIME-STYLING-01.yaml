invariants:
  - 'Styling must work in Player and Editor panels without depending on Editor-only theme inheritance.'
  - 'Consumer panel scale and unrelated RC files remain consumer-owned; changes preserve the existing interaction contract.'
acceptance:
  - id: A1
    given: 'generated controls in Player and Editor panels'
    when: 'the package theme resolves'
    then: 'readable text, explicit button styles, switch label spacing, and distinct selected disabled and focus states have resolved-style and rendered evidence'
  - id: A2
    given: 'open popovers in narrow and normal runtime viewports'
    when: 'content is long or exceeds viewport height'
    then: 'the surface retains its theme, wraps text, stays within bounds, and scrolls oversized content'
  - id: A3
    given: 'the existing interaction pilot and runtime sample'
    when: 'tests and sample renders run'
    then: 'interactions still pass and screenshot artifacts plus documented panel-scaling guidance establish the bounded styling result'
non_functional: {}
contracts:
  - name: 'unity-runtime-style'
    type: behavior
    path: 'packages/ds-unity/Tests/Editor/StylingTests.cs'
