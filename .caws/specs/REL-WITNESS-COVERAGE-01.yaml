invariants:
  - 'Repetition and uniqueness are established over different populations: a readable subset can refute uniqueness, and only full readable coverage can establish it. Discarding an unreadable supplied row must not silently narrow the population the conclusion ranges over.'
  - 'The repair preserves both directions of the repaired reader: an unresolved column stays a schema-class obligation, an unreadable column stays an instance-class obligation, and a readable duplicate still produces the instance fan-out finding even when other supplied rows are unreadable.'
  - 'No new diagnostic, obligation, catalogue code, corpus case, accounting disposition, or primitive-standing change. The obligation and the diagnostic already exist; only the branch that chooses between them moves.'
  - 'The scope of the claim stays the INSTANCE the evidence covers: the reader may not claim uniqueness over unseen rows or an unobserved larger dataset.'
  - 'The five controls committed by REL-WITNESS-COLUMN-RESOLUTION-01 are retained unchanged, and the original sentinel repair is not reverted.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the witness reader reads only the supplied rows that carry a value for every named column, and discards the rest without recording that it did; when a supplied row cannot be read for those columns and no readable row repeats; then the grain obligation stays outstanding instead of the assertion being admitted, because repetition can be established from a readable subset while uniqueness over the supplied population cannot'
