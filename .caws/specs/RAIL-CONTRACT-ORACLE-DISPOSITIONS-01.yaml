id: RAIL-CONTRACT-ORACLE-DISPOSITIONS-01
title: 'Ratchet protected contract mutants and measured blind spots separately'
risk_tier: 2
mode: fix
lifecycle_state: active
created_at: '2026-09-05T00:12:58.504Z'
updated_at: '2026-09-05T00:13:30.510Z'
created_by_session: '01a06d90-6485-7c73-b6c8-0b0ec424c0f8'
blast_radius:
  modules:
    - 'contract-oracle mutation measurement and scheduled verification'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'scripts/contract-oracle-mutation/catalog.mjs'
    - 'scripts/contract-oracle-mutation/selfcheck.mjs'
    - 'scripts/contract-oracle-mutation/run.mjs'
    - 'scripts/contract-oracle-mutation/README.md'
    - '.github/workflows/contract-oracle-mutations.yml'
    - 'docs/current-implementation-snapshot.md'
  out: []
invariants:
  - 'Protected mutants remain independently adjudicated from measured blind-spot sentinels; adding sentinels never weakens a must-detect expectation.'
  - 'Every catalog mutation changes exactly one legal contract leaf, and every expected survivor carries an owning spec plus a reason.'
  - 'Disposition verification is two-directional: an expected detection that survives and an expected survivor that becomes detected both fail until reviewed.'
  - 'Only the full scheduled profile establishes the durable disposition; core-profile observations retain their narrower proof ceiling.'
acceptance:
  - id: A1
    given: 'the measured Badge rtl.flipIcon and ssr.hydrateOn blind spots'
    when: 'the full mutation profile runs'
    then: 'each is executed as a named one-leaf sentinel and its actual outcome is compared with its reviewed disposition'
  - id: A2
    given: 'the existing five protected mutants'
    when: 'any protected mutant survives'
    then: 'disposition verification fails even if the aggregate survivor count is unchanged'
  - id: A3
    given: 'an expected-survivor sentinel gains a detector'
    when: 'the scheduled measurement runs'
    then: 'the stale survivor disposition fails and requires explicit reclassification'
  - id: A4
    given: 'catalog metadata or source preconditions drift'
    when: 'the ordinary CI self-check runs'
    then: 'it fails closed before the expensive mutation workflow'
non_functional: {}
contracts:
  - name: 'contract-oracle-disposition'
    type: behavior
    path: 'scripts/contract-oracle-mutation/catalog.mjs'
