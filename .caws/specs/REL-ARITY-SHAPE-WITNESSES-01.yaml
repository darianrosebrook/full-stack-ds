    evidence_ref: "Tested all five remaining arity facets with an authored {base, patch} pair whose sides differ at exactly that coordinate, then landed the three that are witnessable. WITNESSED (3): field.additivity.semi-additive.nonAdditiveAlong#arity -- a is the corpus near-neighbour FX_N_STOCK_SUM_ALONG_PRODUCT (admissible, blocks only Tue Sep 15 00:50:42 PDT 2026 while the assertion sums along ) and b adds  to the declaration, so along meets the blocked set and CASE_INVENTORY_SUMMED_OVER_TIME fires; evidence.grainWitness#arity -- a one-column witness on rows that repeat on it fans out (REL_GRAIN_FANOUT, the corpus triad's hostile side for ) while naming the pair no row repeats on is the triad's satisfying side; structure.peers[]#arity -- CASE_PEER_TOTALS_AT_A_DIFFERENT_GRAIN is stated for a set EVERY member of which is an aggregate-to-grain, so adding the un-derived source relation makes the claim a different proposition and the rule does not fire. checkWitness ACCEPTS all three single-coordinate witnesses and checkIsolation discharges on both sides of each; the arity erasure truncates to the declared floor and restores the a-side shape. The subtraction gate falls 72 -> 69 of 118 and witnessed verdicts rise 11 -> 14. NOT WITNESSABLE (2), and they are DIFFERENT FACTS: toGrain#arity is not independently erasable -- the erasure on the multi-element side is VIOLATED, because the law requires the declared result grain to equal the target grain as a set, so truncating the target alone leaves the image unable to type its own result; nest.levels#arity is evidence-blocked -- both sides are admissible (a three-level nest is admissible exactly as a two-level one is), so no corpus cause separates the two arities even though the erasure is isolated. That distinction is the one the shape class had been flattening, and it is now recorded in the doctrine and the snapshot. NON-CLAIMS: evidence.grainWitness#arity writes the instance rows IDENTICALLY on both sides because no committed fixture can express the distinction (FX_T_GRAIN_WITNESS_DUPLICATE_ROWS repeats rows identical on every column; FX_T_GRAIN_WITNESS_UNIQUE_ROWS repeats nothing), so it carries a shared SETUP rather than a shared declaration shape -- recorded in its witness note; structure.peers[]#arity reaches admissibility by defeating the divergence law's all-members-are-aggregations precondition, so it establishes that the COUNT of members decides whether the law applies, NOT that a larger all-aggregation peer set would be admissible, and if the law tightens C7 fails and the witness is invalidated (the designed outcome); nonAdditiveAlong#arity establishes that how MANY dimensions are blocked is necessary, not which ones; and none of the three is a claim about a primitive analytical axis. Verified by the analytical suite (19 files, 832 tests), the full root suite (301 files, 4053 tests), all eight analytical gates, docs:check-claims and docs:check-links."
