invariants:
  - 'The predecessor''s interpretation is CORRECTED, not discarded: its product construction, retained baseline sets and scale/grain/cyclic sensitivities stand; what is withdrawn is the claim that every retained program preserves the analytical claims attributed to it, and the precommit''s concrete readback-preservation prediction is recorded as REFUTED rather than vacuous.'
  - 'A relevant premise that is unavailable is CARRIED as an obligation; a contradiction that is established is REFUSED. An omitted composition partition selects no completion, and no unrelated catalogue diagnostic is assigned to keep a result inside the existing cause list.'
  - 'Expected values for a consumer come from the bound operation evaluated over a supplied population, NEVER from inducedClaims. A consumer that passes because its own classification function agrees with itself has demonstrated nothing.'
  - 'Every asserted loss names what becomes unrecoverable, and an unmeasured loss stays unmeasured. Changing a claim label is not evidence of information loss.'
  - 'Out of scope and not to be widened into: OHLC and graph support, the eight unimplemented tasks, projection combinators, production emission, stage-2 census accounting, and exhaustive realization residue. A need to redesign the projection algebra is a stopping result, not permission to widen.'
  - 'Stage 2 stays unratified. This slice ratifies no coordinate and does not change the sequencing decision recorded for the predecessor experiment.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: >-
      Every retained program carries the operation it displays - relation, field,
      aggregate, the dimensions summed over and the result grain - and a candidate
      whose operation is missing or does not match the admitted one is NOT retained:
      it is carried as undecided under the missing premise, never admitted on the
      favorable branch.
  - id: A2
    given: >-
      The composition task's partition premise can be omitted, and the additivity
      kind is read only through nonAdditiveAlong.
    when: >-
      A composition is enumerated with no partition declared, and again with a
      measure whose kind is non-additive or ratio-measure.
    then: >-
      The omitted premise is CARRIED: those candidates are undecided under the
      missing-premise obligation rather than retained on the favorable branch; a
      non-additive measure is refused over any partition; a ratio-measure is refused
      under the corpus's rate cause; and the explicitly declared illegal partition
      is still refused under REL_ADDITIVITY_SUM_SEMIADDITIVE.
  - id: A3
    given: 'Two structurally different programs consume the same bound operation.'
    when: >-
      Each consumer recovers the analytical result over a supplied population and
      the observer compares what they recovered against the operation's own
      evaluation.
    then: >-
      Both consumers recover the SAME values computed from the operation rather than
      from a classification function, the observer distinguishes them from the
      incompatible aggregation direction, and the values are recovered for the
      four-row population as 30 and 105 against the forbidden 110 and 25.
  - id: A4
    given: >-
      A consumer's success could be reported from the declared explanation rather
      than from the bound operation.
    when: >-
      One claim-bearing part of the binding - the bound field, the grouping, or the
      aggregate - is mutated while the declared explanation is left unchanged.
    then: >-
      The mutation is either refused before consumption or produces an OBSERVED
      disagreement between what the consumer recovered and what the operation
      evaluates to, so the result cannot pass by inspecting its own certificate.
  - id: A5
    given: 'The predecessor''s completion record called every check passed.'
    when: 'The retained record is read against the re-executed evidence.'
    then: >-
      It states the precommit's concrete readback-preservation prediction as REFUTED
      rather than vacuous, names the POST-EXCLUSION candidate population rather than
      claiming no candidate is silently dropped from the whole product, and states
      loss labels as absent property names rather than measured information loss,
      with realization-level residue still recorded as unmeasured.
