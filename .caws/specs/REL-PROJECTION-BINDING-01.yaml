  - 'The predecessor''s interpretation is CORRECTED, not discarded: its product construction, retained baseline sets and scale/grain/cyclic sensitivities stand; what is withdrawn is the claim that every retained program preserves the analytical claims attributed to it, and the precommit''s concrete readback-preservation prediction is recorded as REFUTED rather than vacuous.'
