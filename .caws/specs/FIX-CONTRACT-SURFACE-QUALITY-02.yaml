    evidence_ref: "Same 58-route sweep: .card--in-progress computes left 2px rgb(5,102,254) against top 1px rgb(71,70,71); .card--completed left 2px rgb(73,127,33). Proves the rail moved to the variant rather than being deleted. Card.css lines 51-59 emit border-inline-start-{width,color} only under .card--completed / .card--in-progress and the four other status selectors."
