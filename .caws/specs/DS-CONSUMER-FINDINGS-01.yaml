invariants:
  - 'No emitter branches on a component name; each fix is a contract fact or an IR fact every emitter lowers'
  - 'Defaults are unchanged: modal omitted means modal; a Toast without action renders no action part'
  - 'Brand and core token values are not changed; the destructive Button change is a component sidecar change'
  - 'Generated bytes are regenerated, never hand-edited outside admitted @custom regions'
acceptance:
  - id: A1
    given: 'the default brand, whose primary action colour is red'
    when: 'a primary and a destructive Button render in any of the five web frameworks'
    then: 'destructive is the outlined style (transparent fill, danger border and foreground, subtle danger fill on hover) and its computed background differs from primary''s'
  - id: A2
    given: 'a Sheet or Dialog'
    when: 'modal is false'
    then: 'no focus trap, no scroll lock, no backdrop/overlay and no aria-modal=true, in all five web frameworks; with modal omitted or true, today''s modal behaviour is unchanged'
  - id: A3
    given: 'a Toast with an action node'
    when: 'it renders'
    then: 'the action node renders inside the toast__action part in all five web frameworks, and a content-less conditional part honours its if in every emitter'
  - id: A4
    given: 'a Toast'
    when: 'it renders'
    then: 'the root live region is not role=alert, its aria-live follows the politeness prop, and each item keeps role=status'
  - id: A5
    given: 'the change'
    when: 'the governed rail, generate:check, root and framework tests and the realization audits run'
    then: 'all pass and regenerated bytes are committed'
non_functional: {}
contracts:
  - name: 'button-destructive-outlined'
    type: behavior
    path: 'packages/ds-contracts/components/Button/Button.styles.json'
  - name: 'surface-modality-gate'
