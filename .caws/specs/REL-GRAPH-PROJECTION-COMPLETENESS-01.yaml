invariants:
  - 'BOUNDED COMPLETENESS IS CHECKED AGAINST AN INDEPENDENTLY DERIVED SET, not against the enumerator output. The expectation is computed by direct reasoning over the capacity table and the stated domain restriction, without calling enumerateGraph, so a candidate the implementation never generates is visible as a missing member.'
  - 'PRE-COMMITS ARE MEMBERSHIP, NOT COUNTS. A removed capability must remove exactly the predicted candidates and preserve the unaffected ones serving the same task; the predicted membership is recorded before the run.'
  - 'UNPROVEN IS NOT CONTRADICTION AND NEITHER IS UNIMPLEMENTED SUPPORT. A candidate whose premise is missing, one the facts forbid, and a task whose preconditions are not implemented carry different dispositions and must not collapse.'
  - 'No new candidate space is opened: this is the graph topology universe already implemented, and no widening into OHLC, all tasks, combinators, layout or stage-2.'
