invariants:
  - 'The surface path routes by ir.surface.kind: centered modal (dialog) emits; anchored kinds throw until their slice. The factory dispatches every surface kind to surface-emit — the component path refuses surfaces entirely.'
  - 'The openness channel projects through the controllable-state pattern; sheet dismissal drives setOpen(false) → onOpenChange. Dismissal flags (closeOnEscape/closeOnBackdropClick) and focus/modal props are omitted-and-documented (native sheet behavior), never accepted-and-ignored.'
  - 'Region closures derive from compound parts; a region named body renames to bodyContent (Swift View.body collision) — grammar-level, table-driven, no component lore. Chrome is presence-driven through FsdsTheme via the shared suffix vocabulary; prior outputs byte-stable.'
acceptance:
  - id: A1
    given: 'Dialog (surface kind dialog, blocking modality, openness boolean channel)'
    when: 'generate -- --target=swiftui Dialog runs'
    then: 'surface-emit.ts emits a compiling Dialog via the centered-modal branch and swift build exits 0 with prior outputs byte-stable'
  - id: A2
    given: 'the openness channel'
    when: 'the sheet dismisses natively (escape/overlay)'
    then: 'the controllable-state projection routes setOpen(false) → onOpenChange — the dismissal channel is honored by the native sheet behavior, documented as the escape/overlayClick mapping'
  - id: A3
    given: 'ir.surface with an anchored kind (Tooltip/Popover)'
    when: 'surface emission is requested'
    then: 'it still throws explicit not-implemented (fail-loud preserved for the next slice); the component path still refuses every surface kind'
  - id: A4
    given: 'the settings swift lane Danger zone'
    when: 'rebuilt'
    then: 'the confirmationDialog stand-in is replaced by the FSDS Dialog with title/bodyContent/footer regions hosting FsdsButton and the lane compiles'
  - id: A5
    given: 'the full worktree gate'
    when: 'governed:rail, pnpm test, test:frameworks run'
    then: 'all pass with drift confined to packages/ds-swiftui and the swiftui emitter'
non_functional: {}
contracts:
  - name: 'swiftui-dialog-surface'
    type: contract-test
    path: 'packages/ds-codegen/src/frameworks/swift/swiftui/surface-emit.test.ts'
