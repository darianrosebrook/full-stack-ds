    when: 'embed judges'
    then: 'it refuses REL_EMBED_TASK_EXCEEDS_CHANNEL_BUDGET naming that presented channel, and a merely-nonempty budget is not what passes'
  - id: A4
    given: 'an inner composite whose first atomic descendant''s channel the budget hosts while another presented channel it does not'
    when: 'embed judges'
    then: 'the complete-reading rule refuses while the precommitted first-descendant mutant would retain, so descendant-picking is refuted'
  - id: A5
    given: 'an inner composite that is contradicted or unproven'
    when: 'embed judges'
    then: 'the composite inherits the part''s own cause or obligation attributed to part, before and instead of any budget disposition'
  - id: A6
    given: 'a bad host, a bad embedded composite, and a genuine budget incompatibility'
    when: 'each is judged'
    then: 'attribution is host, part and combinator respectively'
  - id: A7
    given: 'the same input observations reordered before composition'
    when: 'embed judges'
    then: 'the normalized embed judgment is equivalent'
  - id: A8
    given: 'a consistent rename of relation, grain fields, range fields, references and rows'
    when: 'judged and compared by normalized fields'
    then: 'the embed judgment is equivalent'
  - id: A9
    given: 'the neutral composite green'
    when: 'the OHLC-derived bounded-range composition is embedded under the same implementation'
    then: 'it is typed without adaptation and without form vocabulary'
  - id: A10
    given: 'a presented channel whose hostability would need a fact the reading does not carry (a cyclic-or-whole channel with no carried cyclicity)'
    when: 'embed judges'
    then: 'the verdict is unproven with the named missing premise, never a refusal and never an invented default'
