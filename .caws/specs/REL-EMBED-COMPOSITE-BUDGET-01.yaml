invariants:
  - 'COMPLETE READING, NEVER A DESCENDANT: the composite branch types every channel the retained reading presents; selecting one atomic descendant''s probe is the false pass this slice exists to refute.'
  - 'CARRIED FACTS ONLY: claim induction reads the transformations the reading carries, through the same channelClaims authority the atomic path uses; nothing is re-read from rows, declarations or fixture identity, and a fact the reading does not carry (e.g. scale cyclicity) is an unproven premise rather than an invented default.'
  - 'STRUCTURE IS PRESERVED: the retained embed verdict carries the inner composite''s population, ranges, panels, claims and provenance unreconstructed.'
  - 'STANDING AND ATTRIBUTION PRECEDE THE BUDGET: a faulted inner composite propagates its own cause or obligation attributed to the part; a bad host is attributed to the host; only a genuine budget incompatibility is the combinator''s.'
  - 'SUPPORTED NEGATIVE IS COMPLETION: if a structured composite''s support requirements cannot be expressed by the scalar Channel[] budget, the slice records that codomain mismatch instead of extending budget opportunistically.'
acceptance:
  - id: A1
    given: 'a retained sub-composite (layer or facet over qualified views) as the embedded part with a sufficient budget'
    when: 'embed judges'
    then: 'the verdict is retained with combinator embed, reached through the composite branch rather than the atomic-only early return'
  - id: A2
