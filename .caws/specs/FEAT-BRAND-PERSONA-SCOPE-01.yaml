acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a brand file with a components.<Name>.<slot> override; when tokens are built and a component consuming that slot is regenerated; then the brand''s per-component value wins over the component''s own default without needing !important or unlayered CSS'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the 5 removed brand files (ocean, midnight, rose, sunset, slate) are deleted and 5 new persona brand files exist; when pnpm -F @full-stack-ds/tokens build runs; then tokens.css contains exactly the new brand set and no dangling references to the removed ones'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the 5 new personas each declare a distinct semantic-layer identity (color, shape, spacing, motion, typography); when tokens:check-contrast and governed:rail run; then all pass with zero drift'
non_functional: {}
contracts:
