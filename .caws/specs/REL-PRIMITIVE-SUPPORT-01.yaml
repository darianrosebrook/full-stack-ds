invariants:
  - "Standing has ONE definition, consumed by the standing function and the audit: neither infers it independently, and a witness whose erasure destroys a sibling facet is classified by the same code that refuses to ratify it."
  - "The distinction is the CARRIER, not the leaf: collateral inside what the erasure removes (a member refinement of the declared leaf, or a declaration under a deleted holder) is a sub-distinction, so subsumption stays correct; a reference-topology facet at the SAME locator is destroyed in place while its carrier survives, so it is independent and does not ratify."
  - "The drift check becomes inadmissible at the gate: a recorded `witnessed` verdict that the live classifier does not ratify fails `analytical:subtraction:gate`, not only a test."
  - "Re-adjudication follows the classifier mechanically; verdicts it demotes move to `unresolved` with the reason naming the sibling facet, and no verdict is hand-favored."
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given primitive standing is conferred by coordinates.length === 1 while the audit classifies the same witness as subsumes-refinements and the ledger prose for along#present already denies primitive-axis standing; when one support classifier reads the footprint and separates collateral INSIDE the erased proposition (member refinements, carrier deletions -- subsumption correct) from a sibling reference-topology facet destroyed in place (nest.levels#incidence -> #order, along#present -> along#arity); then the sibling-facet class does not ratify, the refinement class still does, both the standing function and the audit consume the one classifier, the drift check is wired into the gate so the disagreement is inadmissible, a regression on the real case fails when the rule reverts to length === 1, and the analytical suite, every gate and every ledger agree'
non_functional: {}
