  out: []
invariants:
  - Authored contract surface (prop types, children.accepts, callback field maps) contains no React-admitted type name; ReactNode et al appear only as emitter-lowered images of structural IR nodes.
  - generate:check fails (not warns) when an authored contract references a React-admitted type name, independent of which targets are active — no admission filtering in the semantic gate.
  - Regenerated output across all targets is byte-stable except where the structural vocabulary deliberately changes it; governed:rail and the CI committed-byte drift diff stay green.
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given contracts use a framework-neutral structural node vocabulary and generate:check enforces a type-name-leak check; when a contract authors a React-admitted type name on its authored surface or the corpus is regenerated; then generate:check fails on any authored React type name, the 9 migrated contracts regenerate across all targets, and governed:rail passes'
non_functional: {}
contracts:
