invariants:
  - 'PARTITION BINDING IS REAL: for population-carrying operands the facet resolves the declared partition to a carried source-grain coordinate and its verdict exposes the resulting panel membership; for the aggregate family the partition stays carried and unadjudicated.'
  - 'POPULATION COMES FROM CARRIED IDENTITY: panels are constructed from the qualified/composite reading alone; the facet never reopens source rows or the original relation declaration.'
  - 'POPULATION IS CONSERVED EXACTLY ONCE: every qualified observation belongs to exactly one panel and the union of panel structured keys equals the input key set — no silent intersection, drops, or duplicates.'
  - 'PARTITION IS NOT ORDERING: panel membership says which observations belong together; it says nothing about traversal order, and member order within range groups stays canonical, never semantic.'
  - 'NESTED STRUCTURE IS CARRIED, NOT RECONSTRUCTED: each panel binds the inner layer''s derived bounded-range groups as they were derived; a facet that preserves membership but loses the relationship is defective.'
  - 'STANDING AND EXISTING RULES ARE CONSERVED: a faulted operand refuses or unproves the facet before panels exist; scale policy stays orthogonal to membership; no form lore participates.'
acceptance:
  - id: A1
    given: 'a layer over co-registered qualified field views carrying a derived bounded-range group, faceted by one carried grain coordinate'
    when: 'the facet judges'
    then: 'the verdict exposes panels whose membership is derived from the carried bindings, each panel binding the inner layer''s range group unreconstructed'
  - id: A2
    given: 'the facet''s panels'
    when: 'their structured keys are collected'
    then: 'the union equals the operand population''s key set exactly — every observation in exactly one panel, none dropped or duplicated'
  - id: A3
    given: 'the operand observations arbitrarily reordered before qualification'
    when: 'the facet judges and panels are compared by normalized fields'
    then: 'panels are equivalent, and the precommitted positional-assignment mutant provably differs under the same reorder'
  - id: A4
    given: 'one observation whose partition-coordinate value alone is changed'
    when: 'the facet judges'
    then: 'exactly that observation''s key changes panel membership and no unrelated observation moves'
  - id: A5
    given: 'a declared partition coordinate the carried bindings do not bind'
    when: 'the facet judges'
    then: 'it refuses before any panels are produced, naming the unbound coordinate — never row[partition] defaulting'
  - id: A6
    given: 'an operand observation carrying a contradicted or unproven standing'
    when: 'the facet composes over it'
    then: 'the facet inherits the operand''s fault attributed to the part and no clean panels are produced'
  - id: A7
    given: 'the same bound composition under facet policy shared and free'
    when: 'both are judged'
    then: 'membership, range topology and standing are identical and only the comparability claim and profile differ'
  - id: A8
    given: 'a consistent rename of relation, grain fields, partition coordinate, range fields, references and rows'
    when: 'judged and compared by normalized fields'
    then: 'panels and ranges are equivalent'
  - id: A9
    given: 'the neutral case green and the real corpus fixture'
    when: 'the same implementation facets the qualified OHLC range by a carried grain coordinate'
    then: 'panels derive without adaptation and without form vocabulary'
  - id: A10
    given: 'the precommitted range-dropping mutant (grouping that loses the inner derived structure)'
    when: 'the nested-structure criterion evaluates the real verdict against it'
    then: 'the real panels carry the inner range groups and the mutant''s shape is distinguished'
