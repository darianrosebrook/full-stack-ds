invariants:
  - 'The shadow lowering is a NARROW mirror of the tokens build (structured dimensions as `${value}${unit}`; srgb structured color as lowercase #rrggbb plus hex8 alpha Math.round(a*255) when alpha < 1; optional spread/inset; layers joined ", ") — anything outside that envelope (non-srgb colorSpaces, string-typed dimensions, typography or other composites, unparseable JSON) returns undefined and the chain stays SKIPPED. Refuse-to-guess survives outside the envelope.'
  - 'The mirror is drift-LOUD, not silent: an oracle test lowers the three real semantic.elevation.surface composites from the committed resolved.tokens.json and compares against the emitted values in the committed tokens.css. If the emitter lowering ever changes without the mirror, the test fails — the "second source of truth" objection raised in FALLBACK-STALE-01 is answered by failing loudly, never by silently writing wrong fallbacks.'
  - 'Canonicalization only ever suppresses findings, never creates them: rgba(r,g,b,a) <-> #rrggbbaa equivalence, rgb(r,g,b) <-> #rrggbb, whole-token bare 0 <-> 0px. Order matters: rgba conversion runs BEFORE bare-zero normalization so rgba internals are never touched.'
  - 'No component-name special-casing: the lowering and the gate are shape-driven, per the repo emitter-authority doctrine.'
  - 'Fallback correctness remains a light-mode-only claim (unchanged from FALLBACK-STALE-01); shadow tokens are not theme-split today, and if they become so the light projection applies before lowering.'
acceptance:
  - id: A1
    given: 'a resolvesTo chain terminating in a serialized srgb shadow composite'
    when: 'generate:check runs'
    then: 'the gate lowers it via the mirrored emitter lowering and reports stale literals as [FALLBACK_STALE] with the lowered literal, not skipped'
  - id: A2
    given: 'the repaired corpus where all elevation fallbacks carry the emitted literals'
    when: 'generate:check runs'
    then: 'zero [FALLBACK_STALE] findings, 49/49 contracts pass, rail green'
  - id: A3
    given: 'representation drift (rgba vs hex8, leading bare 0, comma spacing)'
    when: 'fallbacks are compared'
    then: 'no finding fires (suppress-only canonicalization)'
  - id: A4
    given: 'a composite outside the mirror envelope (non-srgb color, string dimensions, typography)'
    when: 'the chain resolves'
    then: 'it is skipped as unresolvable (refuse-to-guess preserved)'
  - id: A5
    given: 'the committed resolved.tokens.json and tokens.css'
    when: 'the oracle test lowers the three semantic.elevation.surface composites'
    then: 'the results equal the emitted CSS values (mirror drift-locked to the emitter)'
non_functional: {}
