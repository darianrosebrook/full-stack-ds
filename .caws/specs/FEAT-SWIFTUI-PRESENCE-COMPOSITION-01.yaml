  out: []
invariants:
  - 'ControllableValue is generic over the channel''s valueType and parameterized only by IR facts (channel value/default/onChange prop names); no component identity anywhere in the substrate or helper.'
  - 'Presentation remains a fact-keyed table: surface.kind (dialog/sheet/toast/tooltip) and collapsibleTo (toggle/disclosure) select idioms; adding a presentation is a table row, never a new state machine.'
  - 'The controlled-takes-precedence semantics are pinned in runtime tests, not per-component tests — the rule lives in one place.'
acceptance:
  - id: A1
    given: 'the controlled/uncontrolled/onChange trio duplicated across 8 components (56 projection occurrences measured)'
    when: 'the substrate lands'
    then: 'a generic ControllableValue<Value> runtime (hand-maintained alongside FsdsTheme) plus one emitter helper derived from ir.behavior.normalizedChannels replaces every per-class copy — emitted code per component shrinks to field+init+binding lines'
  - id: A2
    given: 'ControllableValue<Value>'
    when: 'XCTest runs'
    then: 'controlled-takes-precedence, onChange-on-every-set, and binding round-trip semantics are pinned — identical to the React useControllableState rule the projections encoded'
  - id: A3
    given: 'Toast (surface kind toast, ephemeral presence, open channel, motion dwell tokens)'
    when: 'generated'
    then: 'it emits THROUGH THE SAME substrate with only a new presentation-table row (overlay + task-driven dwell auto-dismiss from token scopes) — zero new state-machine code; admitted 20→21; compiles'
  - id: A4
    given: 'the composition-survives-generation claim'
    when: 'this slice closes'
    then: 'every controllable emission (presence AND value channels) derives from the channel facts through one helper; presentation differs only by the surface.kind/collapsibleTo table; measured duplication before/after recorded'
  - id: A5
    given: 'the full worktree gate'
    when: 'typecheck, governed:rail, pnpm test, test:frameworks, swift test, swift build run'
    then: 'all pass; prior surfaces'' tests updated to the substrate emission; remaining corpus fails loudly'
non_functional: {}
contracts:
  - name: 'swiftui-controllable-value'
    type: contract-test
    path: 'packages/ds-swiftui/Tests/DsSwiftUITests/ControllableValueTests.swift'
