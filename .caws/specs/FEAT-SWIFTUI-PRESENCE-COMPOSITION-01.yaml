updated_at: '2026-08-16T23:10:18.088Z'
blast_radius:
  modules:
    - 'packages/ds-swiftui/Sources/DsSwiftUI/Presence/ControllableValue.swift (runtime substrate)'
    - 'packages/ds-codegen/src/frameworks/swift/swiftui/controllable.ts (channel-fact emission helper) + refactored emissions'
    - 'fsds.targets.json + docs (Toast admitted; compositional claim recorded)'
  data_migration: false
