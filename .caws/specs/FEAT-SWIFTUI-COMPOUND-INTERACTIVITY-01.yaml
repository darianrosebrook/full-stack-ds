id: FEAT-SWIFTUI-COMPOUND-INTERACTIVITY-01
title: 'SwiftUI compound interactivity: wire Tabs/Accordion/Shuttle channels to pressable controls, AX-press-proven'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: swiftui-compound
created_at: '2026-08-22T01:11:24.560Z'
updated_at: '2026-08-22T03:11:42.372Z'
blast_radius:
  modules:
    - 'TODO: list one or more modules this spec touches.'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/swift/swiftui'
    - 'packages/ds-swiftui'
    - 'fsds.targets.json'
    - '.github/workflows/ci.yml'
    - '.githooks/pre-push'
    - 'docs/current-implementation-snapshot.md'
    - scripts/prepush-scope.mjs
  out: []
invariants:
  - 'No per-component-name lore in the emitter: the deepening keys off IR facts (channel name/type, compound part anatomy) exactly like the web/RN compound paths — if a new compound component matches the shape, it deepens too.'
  - 'The channel stays the single source of truth: subcomponents mutate it through ControllableValue.set (the same controlled/uncontrolled routing every swift surface uses), never through local divergent state.'
  - 'Union openness keeps its v1 lowering (multi member [String]); the Accordion wiring operates on that same shape the web compound path uses, not a bespoke variant.'
  - 'The press-proof harness only gets STRICTER: proofs replace the structural limitation entry; pre-existing proofs must keep passing; the census remains the honest artifact.'
  - 'Drift-gating extends to the two native trees with the same byte-stability standard as the six TS trees — regenerating is a no-op on a clean tree.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a composed swift Tabs surface (List/Tab/Panel subcomponents); when the harness AXPresses a tab; then onActiveTabChange fires exactly once with that tab value and the selected panel becomes visible (census exposes pressable controls, not zero)'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a composed swift Accordion surface; when the harness AXPresses an item trigger; then the openness channel change fires with the item key and pressing again toggles it back (both directions)'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a swift Shuttle item; when the harness AXPresses an unselected item; then the selection channel gains it and a second press removes it (both directions)'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the deepened emission; when the press-proof harness runs; then the structural limitation entry for tabs/accordion/shuttle is retired and every pre-existing proof (Switch/Select/Calendar/Dialog/Chip/Walkthrough) still passes'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the swiftui allowlist; when NavTree and Markdown are admitted; then the full 51-corpus emits, swift build stays green, and Markdown''s plain-text degradation is documented'
  - id: A6
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the native generated trees; when CI (and the pre-push drift list) regenerate; then packages/ds-swiftui component sources and the compose tree are git-diff drift-gated like the six TS trees'
non_functional: {}
