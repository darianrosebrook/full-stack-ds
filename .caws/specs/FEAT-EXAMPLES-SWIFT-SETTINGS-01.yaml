acceptance:
  - id: A1
    given: 'the committed generated ds-swiftui package and the new examples/settings/swift SwiftPM lane'
    when: 'swift build runs with package path examples/settings/swift'
    then: 'the consumer executable compiles against the DsSwiftUI product via local package path and exits 0'
  - id: A2
    given: 'the swift lane''s SettingsView'
    when: 'its source is inspected'
    then: 'it composes only public DsSwiftUI exports (Switch/ToggleSwitch today) plus SwiftUI primitives for unrealized regions, with the unrealized subset documented as non-claims in the lane README'
  - id: A3
    given: 'the native-compile-rail-swift CI job on a macOS runner'
    when: 'the workflow runs'
    then: 'it compiles the example lane in addition to the smoke fixtures and fails the job on compile error'
  - id: A4
    given: 'the examples README portfolio table'
    when: 'the lane lands'
    then: 'the settings row and status table name the swift lane with its claim, falsifier, and non-claims'
  - id: A5
    given: 'the full local gate inside the worktree'
    when: 'pnpm run governed:rail and pnpm test run'
    then: 'both pass unchanged (the lane is consumer-only; no codegen output changes)'
non_functional: {}
