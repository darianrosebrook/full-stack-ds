id: COMPONENT-TOKEN-CONSUMPTION-01
title: 'Retire unused component tokens and enforce consumed-only emission'
risk_tier: 2
mode: refactor
lifecycle_state: active
worktree: token-consumption
created_at: '2026-09-06T05:48:28.365Z'
updated_at: '2026-09-06T05:52:30.742Z'
created_by_session: '01a074e8-6c81-7f93-8d64-5c64eca9cfa6'
blast_radius:
  modules:
    - 'Component token declarations, target consumers, emission and zero-gap validation'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-contracts'
    - 'packages/ds-codegen/src'
    - 'packages/ds-*/src/**'
    - 'packages/ds-tokens'
    - 'packages/ds-figma'
    - 'packages/ds-swiftui'
    - 'packages/ds-jetpack-compose'
    - 'scripts'
    - 'src/components/properties-panel'
    - 'src/types'
    - 'material-surface.ts'
    - 'vite-plugin-fsds-data.ts'
    - 'e2e'
    - 'docs/architecture'
    - 'docs/current-implementation-snapshot.md'
    - packages/ds-codegen/package.json
  out: []
  support:
    - pnpm-lock.yaml
    - package.json
    - AGENTS.md
    - docs/normal-form.md
    - doc-freshness-baseline.json
invariants:
  - 'Semantic vocabulary may be unset or unconsumed; component declarations must have a real property or behavior consumer, with no compatibility-only aliases.'
  - 'Preserve supported component decisions and authored defaults; source absence alone is not authority to remove behavior or anatomy.'
acceptance:
  - id: A1
    given: 'the residual component token ledger'
    when: 'declarations are adjudicated and migrated'
    then: 'each residual is removed with source evidence or bound to its intended consumer and no legacy gap remains'
  - id: A2
    given: 'target-specific CSS and behavior realization'
    when: 'tokens are emitted'
    then: 'only the used declaration closure is emitted and alias cycles or disconnected declarations cannot count as consumption'
  - id: A3
    given: 'an unused component token is introduced or an existing consumer is severed'
    when: 'validation runs'
    then: 'the change is rejected without an accepted-debt ledger or compatibility exception while semantic non-use stays allowed'
  - id: A4
    given: 'the cleaned corpus'
    when: 'generation, framework and browser checks run'
    then: 'component defaults, overrides and affected behavior are verified and remaining proof limits are explicit'
non_functional: {}
contracts:
  - name: 'component-token-consumption'
    type: schema
    path: 'packages/ds-contracts/component.tokens.schema.json'
