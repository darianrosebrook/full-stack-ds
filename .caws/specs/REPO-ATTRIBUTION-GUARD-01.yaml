id: REPO-ATTRIBUTION-GUARD-01
title: 'Attribution guard: refuse AI co-author trailers and agent commit identities'
risk_tier: 2
mode: feature
lifecycle_state: active
created_at: '2026-09-23T01:00:54.541Z'
updated_at: '2026-09-23T01:01:13.349Z'
created_by_session: 'session-b7064ea9-728e-401b-b2ed-29e7e9483e9a'
blast_radius:
  modules:
    - 'commit attribution guard (hooks + CI)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'scripts/attribution-guard.mjs'
    - 'scripts/attribution-guard.test.mjs'
    - '.githooks/commit-msg'
    - '.githooks/pre-push'
    - 'package.json'
    - '.github/workflows/ci.yml'
    - 'AGENTS.md'
    - 'CLAUDE.md'
  out: []
invariants:
  - 'No commit reaching the default branch carries a Co-authored-by trailer for an AI agent identity'
  - 'The guard is range-scoped so grandfathered history does not red the gate'
acceptance:
  - id: A1
    given: 'a commit message carrying a Co-authored-by trailer naming a known AI agent'
    when: 'the guard evaluates it'
    then: 'it exits non-zero and names the offending line'
  - id: A2
    given: 'a commit whose author or committer email is a known AI identity'
    when: 'the guard evaluates the range'
    then: 'it exits non-zero and names the identity'
  - id: A3
    given: 'a developer runs git commit with a blocked trailer'
    when: 'the commit-msg hook runs'
    then: 'the commit is refused and the trailer never enters history'
  - id: A4
    given: 'commits in the pushed range that bypassed the local hook'
    when: 'git push runs'
    then: 'the pre-push backstop scans them and CI runs the same guard'
  - id: A5
    given: 'a message with no attribution trailer and a human identity'
    when: 'the guard evaluates it'
    then: 'it exits zero'
non_functional: {}
contracts:
  - name: 'attribution-guard'
    type: behavior
    path: 'scripts/attribution-guard.mjs'
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "The cited node test asserts a single co-author violation at line 3 whose reason names noreply@anthropic.com. Plus a live counterfactual against real history: node scripts/attribution-guard.mjs --range fde10305860bed2eb000e18dc57cb091a054e4b0^! exits 1 and prints \"line 3: Co-authored-by: Qwen-Coder <qwen-coder@alibabacloud.com>\"."
    recorded_at: "2026-09-23T01:18:42.951Z"
    test_nodeid: "scripts/attribution-guard.test.mjs::a known agent co-author trailer is refused and named"
    command: node --test scripts/attribution-guard.test.mjs
    exit_code: 0
    commit_sha: "6645e4a0"
  - criterion_id: A2
    status: pass
    evidence_ref: "Pins both the exact-address rule (noreply@anthropic.com) and the domain rule (agent@anthropic.com), and asserts the human identity darianrosebrook <hello@darianrosebrook.com> is admitted. Reinforced by the integration case \"git commit is REFUSED when the author identity is an agent\", which drives a real git commit in a temp repo whose core.hooksPath points at this repo .githooks and asserts non-zero exit, stderr matching /AI agent commit identity/, and git rev-list --count --all == 0."
    recorded_at: "2026-09-23T01:19:25.770Z"
    test_nodeid: "scripts/attribution-guard.test.mjs::AI commit identities are refused; human identities are not"
    command: node --test scripts/attribution-guard.test.mjs
    exit_code: 0
    artifact_path: scripts/attribution-guard.mjs
    commit_sha: "6645e4a0"
  - criterion_id: A3
    status: pass
    evidence_ref: "Asserts non-zero exit, /attribution-guard/ on stderr, and rev-list --count --all == 0, so nothing entered history. The companion case \"the commit-msg hook is present and executable\" asserts the executable bit, which is what makes the refusal meaningful because git silently skips a non-executable hook. Live in the canonical checkout: git hook run commit-msg -- <message file carrying a Claude trailer> exits 1 with the refusal text; the identical command on a clean message exits 0."
    recorded_at: "2026-09-23T01:19:26.526Z"
    test_nodeid: "scripts/attribution-guard.test.mjs::git commit is REFUSED when the message carries an agent co-author trailer"
    command: node --test scripts/attribution-guard.test.mjs
    exit_code: 0
    artifact_path: .githooks/commit-msg
    commit_sha: "6645e4a0"
  - criterion_id: A4
    status: pass
    evidence_ref: "Asserts the --no-verify precondition, then that the range scan exits 1 on the smuggled commit and 0 on the clean control. Real invocation over the real range: printf \"refs/heads/main TIP refs/heads/main origin-main\" | .githooks/pre-push origin <url> exits 0 and prints \"[attribution-guard] clean — 7 commits checked in 5dcc2a63..76a8f321\", with classifier 55/55 and guard 17/17. The CI step runs the identical script; actionlint .github/workflows/ci.yml exits 0 including the embedded shell. NOT covered: the CI step never executed on GitHub because no push was made."
    recorded_at: "2026-09-23T01:19:27.350Z"
    test_nodeid: "scripts/attribution-guard.test.mjs::the range scan catches a commit that bypassed the hook with --no-verify"
    command: node --test scripts/attribution-guard.test.mjs
    exit_code: 0
    artifact_path: .githooks/pre-push
    commit_sha: "6645e4a0"
  - criterion_id: A5
    status: pass
    evidence_ref: "Asserts a real clean commit exits 0 and rev-list count is 1. Paired with \"an obviously clean message passes\" for the admitted direction and \"an unknown address is STILL refused\" for the default-deny direction. Landed-revision scan: node scripts/attribution-guard.mjs --range origin/main..main exits 0 over 10 commits; that range excludes the three grandfathered Qwen-Coder commits by construction because they predate origin/main, which is the intended behavior, while a full-history scan flags exactly 3."
    recorded_at: "2026-09-23T01:19:28.216Z"
    test_nodeid: "scripts/attribution-guard.test.mjs::a clean commit goes through — the hook is not a blanket refusal"
    command: node --test scripts/attribution-guard.test.mjs
    exit_code: 0
    artifact_path: scripts/attribution-guard.mjs
    commit_sha: "6645e4a0"