id: REPO-ATTRIBUTION-GUARD-01
title: 'Attribution guard: refuse AI co-author trailers and agent commit identities'
risk_tier: 2
mode: feature
lifecycle_state: active
created_at: '2026-09-23T01:00:54.541Z'
updated_at: '2026-09-23T01:01:13.349Z'
created_by_session: 'session-b7064ea9-728e-401b-b2ed-29e7e9483e9a'
blast_radius:
  modules:
    - 'commit attribution guard (hooks + CI)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'scripts/attribution-guard.mjs'
    - 'scripts/attribution-guard.test.mjs'
    - '.githooks/commit-msg'
    - '.githooks/pre-push'
    - 'package.json'
    - '.github/workflows/ci.yml'
    - 'AGENTS.md'
    - 'CLAUDE.md'
  out: []
invariants:
  - 'No commit reaching the default branch carries a Co-authored-by trailer for an AI agent identity'
  - 'The guard is range-scoped so grandfathered history does not red the gate'
acceptance:
  - id: A1
    given: 'a commit message carrying a Co-authored-by trailer naming a known AI agent'
    when: 'the guard evaluates it'
    then: 'it exits non-zero and names the offending line'
  - id: A2
    given: 'a commit whose author or committer email is a known AI identity'
    when: 'the guard evaluates the range'
    then: 'it exits non-zero and names the identity'
  - id: A3
    given: 'a developer runs git commit with a blocked trailer'
    when: 'the commit-msg hook runs'
    then: 'the commit is refused and the trailer never enters history'
  - id: A4
    given: 'commits in the pushed range that bypassed the local hook'
    when: 'git push runs'
    then: 'the pre-push backstop scans them and CI runs the same guard'
  - id: A5
    given: 'a message with no attribution trailer and a human identity'
    when: 'the guard evaluates it'
    then: 'it exits zero'
non_functional: {}
contracts:
  - name: 'attribution-guard'
    type: behavior
    path: 'scripts/attribution-guard.mjs'
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "node --test scripts/attribution-guard.test.mjs on landed main 6645e4a0: 17/17 pass. Case \"a known agent co-author trailer is refused and named\" asserts a single violation of kind co-author at line 3 whose reason names noreply@anthropic.com. Live counterfactual against real history: node scripts/attribution-guard.mjs --range fde10305860bed2eb000e18dc57cb091a054e4b0^! exits 1 and prints \"line 3: Co-authored-by: Qwen-Coder <qwen-coder@alibabacloud.com>\"."
    recorded_at: "2026-09-23T01:17:53.597Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "Case \"AI commit identities are refused; human identities are not\" pins both the exact-address rule (noreply@anthropic.com) and the domain rule (agent@anthropic.com), and asserts the human identity darianrosebrook <hello@darianrosebrook.com> is admitted. Integration case \"git commit is REFUSED when the author identity is an agent\" drives a real git commit in a temp repo whose core.hooksPath points at this repo .githooks: non-zero exit, stderr matching /AI agent commit identity/, and git rev-list --count --all == 0, so nothing entered history."
    recorded_at: "2026-09-23T01:17:54.278Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "Case \"the commit-msg hook is present and executable\" asserts the executable bit, which is what makes the other refusal cases meaningful: git silently skips a non-executable hook. Case \"git commit is REFUSED when the message carries an agent co-author trailer\" asserts non-zero exit, /attribution-guard/ on stderr, and rev-list --count --all == 0. Live in the canonical checkout: git hook run commit-msg -- <message file carrying a Claude trailer> exits 1 with the refusal text; the identical command on a clean message exits 0."
    recorded_at: "2026-09-23T01:17:54.960Z"