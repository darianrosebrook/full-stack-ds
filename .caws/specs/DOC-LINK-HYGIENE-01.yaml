id: DOC-LINK-HYGIENE-01
title: 'Repair broken relative doc links and unflagged gitignored pointers'
risk_tier: 3
mode: doc
lifecycle_state: active
worktree: doc-link-hygiene
created_at: '2026-08-17T17:04:39.516Z'
updated_at: '2026-08-17T17:06:22.660Z'
blast_radius:
  modules:
    - 'doc cross-references'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'docs'
    - 'packages/ds-tokens/README.md'
    - 'packages/ds-tokens/build/w3c/README.md'
    - 'README.md'
    - scripts/docs-link-check.mjs
  out: []
invariants:
  - 'Every relative markdown link in a tracked doc resolves to an existing file'
  - 'A tracked doc pointing into gitignored docs/internal/ says so at the point of reference'
acceptance:
  - id: A1
    given: 'the repo-wide broken-link sweep'
    when: 'it runs over every tracked markdown file'
    then: 'it reports zero unresolved relative .md links'
  - id: A2
    given: 'a reader in a fresh clone follows a docs/internal reference from a tracked doc'
    when: 'the path is absent'
    then: 'the citing doc already told them it is machine-local'
non_functional: {}
contracts: []
