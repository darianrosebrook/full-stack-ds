evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "pnpm exec vitest run packages/ds-codegen/src/analytical (21 files / 922 tests; projection.test.ts 42) and pnpm test (303 files / 4143 tests), typecheck, lint, docs:check-claims green; governed:rail and test:frameworks green in the worktree on merge 85b1b67d; all seven ledger gates green with unchanged numbers. RESULT FACTS, MEASURED: admitOperation on the fixture own assertion yields resultGrain [date], dimension field `date`, measure field `sum(on_hand)`, measure transformation ratio, nonAdditiveAlong [date]; the projection dimension is NOT the source column the operation sums over (asserted by inequality against BASIS.summedOver). The operation is validated against the relation it NAMES before any candidate exists: relation does_not_exist THROWS (previously it retained 42), along [warehouse] throws, resultGrain [product] throws, and an aggregate other than sum throws for both admitOperation and evaluateOperation (previously mean/min/count all executed as sum, and matching mean descriptors on both sides returned ok while returning sums). A merely MISSING premise is carried rather than resolved either way: grain unknown -> 0 retained and every disposed candidate undecided under grain:declared with a non-empty detail. Candidate identity is now a CONSTRUCTION property - every retained program is stamped from the validated operation and each is asserted to equal it. Population: 168 considered, disposed named, and retained+refused+undecided asserted to equal disposed. NON-CLAIM: the enumerator has no second, independently established admitted operation to compare a caller-supplied one against, so an operation for a DIFFERENT analysis is refused only where it contradicts the relation; that limit is recorded in correctedAccount.operationIdentity."
    recorded_at: "2026-09-18T02:59:04.136Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "THE CORE OF THIS SLICE, and the reason the earlier A3 claim was withdrawn. Both binding-slice consumers called evaluateOperation, so nothing representation-dependent lay between expected and recovered: their agreement showed the binding and channel guards admit ONE SHARED EVALUATION, not that a value survived an encoding. Now evaluateOperation runs ONCE, produce() builds a readback output (explicit group and value) and a metric output (explicit group and extent under a DECLARED scale of two extent units per value) from THAT one result, and recovery is observed through the representations. MEASURED: result day1=30 and day2=105; readback entries recover 30 and 105; metric entries are extents 60 and 210 and decode to 30 and 105 using the declared scale, while decoding the same extents under a declared scale of 1 returns 60 and 210 - which is what shows the decoder reads the SCALE rather than re-deriving the answer. Every decoder takes exactly ONE argument (asserted through Function.length) so it cannot receive the rows, the evaluator, or the admitted operation. The forbidden cross-date direction still evaluates to A=110 and B=25 and is distinguished from the recovered values. Also repaired here: metricConsumer reported the channel as length for every non-readback success, including the area program the runner actually selects; it now reports the channel it consumed, asserted against the selected program. NON-CLAIM: a decoder recovering a value from a produced representation over ONE supplied population is not general rendering, and the metric representation carries no marks, axes or layout."
    recorded_at: "2026-09-18T02:59:42.837Z"