invariants:
  - 'A decoder receives ONLY the produced representation. It is given neither the supplied rows nor access to evaluateOperation, so it cannot reconstruct the expected answer instead of observing what the projection produced. A second evaluation of the same operation is not evidence that a distinct representation preserved it.'
  - 'The enumerator consumes RESULT facts derived from the admitted operation and the named relation, not independently supplied source facts that can describe a different relation or a field the operation already aggregated away. The operation is validated against the relation, including its name.'
  - 'The executable contract is narrowed to the aggregate it can actually perform: an unsupported aggregate name is REJECTED, never executed as sum. Implementing every aggregate is out of scope.'
  - 'Neither 42 retained candidates nor unchanged ledger counts is an acceptance requirement. Deriving result-field facts may change the candidate population, and that change is recorded rather than resisted.'
  - 'Out of scope and not to be widened into: OHLC and graph support, the eight unimplemented tasks, general combinators, production emission, stage-2 accounting, and exhaustive realization residue. A requirement to build any of those is a stopping finding.'
acceptance:
