acceptance:
  - id: A1
    given: 'the token graph''s component scopes (incl. Switch''s 31 color slots) and the RN/Swift theme-runtime normal form'
    when: 'a hand-authored FsdsTheme.kt lands in ds-jetpack-compose and the emitter emits per-component token-scope data'
    then: 'components resolve values through LocalFsdsTheme with theme[name] → literal → fallback semantics identical to RN and Swift, with dp/color accessors'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'the native-toggle path resolves its default-state color and dimension slots through the theme (brand-colored track/thumb via SwitchDefaults.colors overrides) with graceful fallback where the graph carries no slot; no RN, Swift, or web tree changes — full-corpus regeneration leaves them byte-identical'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'the theme module bridges FSDS semantic action/status tokens into a MaterialTheme ColorScheme, and the settings lane installs FsdsThemeProvider plus the bridged MaterialTheme so both FSDS switches and NOT-FSDS chrome render brand colors — burning the lane''s purple-defaults findings; visual parity vs the react lane confirmed by manual rerun'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'gates green: gradle compile exit 0 through the composite lane, generate:check, root tests; diff scope confined to the slice'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'snapshot and lane README updated; mode (adaptive light/dark), brand, and density axes recorded as the reserved follow-up rungs of the styling cutover ladder'
non_functional: {}
