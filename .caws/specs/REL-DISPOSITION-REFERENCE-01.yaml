acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a result kind and task the experiment does not implement; when the enumerator is invoked; then it returns an explicit unsupported disposition decided before candidate generation and no candidate carries an analytical diagnostic for absent implementation'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an empty inventory and an unimplemented task; when the enumerator is invoked; then the unsupported disposition is returned rather than a silently empty result'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given one task name on the relation path and the graph path; when support is decided; then topology is supported on the graph path and unsupported on the relation path'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the graph-view endpoint binding; when each endpoint field is changed alone; then the joint-minimality claim is withdrawn and replaced by independently separating single-coordinate evidence and no new restriction is added to the contract'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a source declaring more than one unique key field; when keyField is changed; then the redundancy disposition is qualified to the single-key premise that established it'
  - id: A6
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given graphCandidateIsSound; when a program declares a task other than the one its assignment induces claims for; then it is not reported sound'
  - id: A7
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the irrelevant-capability control; when the added channel is genuinely absent from the inventory; then membership is unchanged'
