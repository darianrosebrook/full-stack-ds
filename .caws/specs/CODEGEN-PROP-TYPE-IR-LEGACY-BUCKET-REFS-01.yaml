acceptance:
  - id: A1
    given: 'the styled/hook propMember schema'
    when: 'a legacy-bucket member authors a structured propType'
    then: 'schema validation admits exactly one of type/propType and rejects both-or-neither'
  - id: A2
    given: 'Postcard author/stats/embed and Walkthrough steps migrated to ref/array propType'
    when: 'all targets are regenerated'
    then: 'emitted bytes for Postcard and Walkthrough are identical to pre-migration'
  - id: A3
    given: 'Select filterFn migrated to a callback propType'
    when: 'all targets are regenerated and gates run'
    then: 'the only committed byte change is the redundant-paren normalization of its signature and governed:rail passes'
  - id: A4
    given: 'prop-type-ir.test.ts extended'
    when: 'the ds-codegen suite runs'
    then: 'legacy-bucket propType members are proven to normalize and lower through canonicalTsType identically to designed members'
