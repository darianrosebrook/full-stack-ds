invariants:
  - 'Each new path keys off IR shape facts (content-binding kind, channel shape, root role) — zero per-component names.'
  - 'Foundation-only substrates (BasicText, Canvas-painted progress): zero androidx.compose.material imports in generated code.'
  - 'Prop-text leaves reuse the slice-2 TextStyle machinery (ProvideFsdsTextStyle / LocalFsdsContentColor) where the scopes carry typography slots.'
  - 'The usage ratchet applies to the new admits automatically: every emitted lookup declares an existing scope key and every RN-consumed chrome/text slot is consumed.'
  - 'Markdown degrades to plain text (content-transform parsing stays web-only), mirroring RN and swift.'
acceptance:
  - id: A1
    given: 'a prop-text leaf shape'
    when: 'the static root (or its code part) binds text content to a prop'
    then: 'the composable emits foundation BasicText with the bound prop as text, wrapped in the content-role TextStyle machinery — CodeBlock, CodeSnippet, and Markdown admit without throwing.'
  - id: A2
    given: 'an expandable-content shape'
    when: 'a children leaf pairs with an expand boolean channel'
    then: 'the composable emits a stateful maxLines text whose line limit is gated by the expanded channel with a show-more/less trigger wired to it — Truncate and ShowMore admit.'
  - id: A3
    given: 'a progressbar/status root'
    when: 'the component declares no value channel'
    then: 'the composable emits a foundation-only custom-painted indicator — a determinate bar driven by the 0-100 value prop or an indeterminate spinner — with progressBarRangeInfo semantics — Progress and Spinner admit.'
  - id: A4
    given: 'the whole batch'
    when: 'gated'
    then: 'fsds.targets.json lists 23 admitted components, generation succeeds, pnpm run governed:rail + pnpm test + pnpm run test:frameworks + node scripts/compose-parity-diff.mjs + docs:check-claims all pass, the gradle library plus settings example lane compile green, and the generated trees are committed.'
  - id: A5
    given: 'the parity gate'
    when: 'the new admits emit'
    then: 'the usage ratchet covers them with zero dead lookups and RN-consumed chrome/text slots consumed per path, and Markdown plain-text degradation is a named non-claim.'
