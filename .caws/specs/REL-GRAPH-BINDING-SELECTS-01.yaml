id: REL-GRAPH-BINDING-SELECTS-01
title: 'Make the graph binding select and qualify its node universe, and repair the incidence decoder collision'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-18T05:19:44.967Z'
updated_at: '2026-09-18T05:19:44.967Z'
