invariants:
  - 'The necessity census claims only degrees of freedom the declaration expresses. Where the emitted schema cannot say whether a name list''s order is semantic, the census must not emit an order facet for it, and a name list that declares no sequence fact is a defect the walk refuses rather than a coordinate the walk invents.'
  - 'The sequence fact is stated where the authority is: a list is `set` when no rule, engine or operator law reads the position of its members, and `ordered` when one does. It is recorded in the model that emits the schema the census reads, so the fact and the coordinate rule cannot drift apart.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the census emits an order facet on every name list while the emitted schema cannot say whether a sequence is semantic, and project.keep and structure.peers[] order is measured inert; when the declaration is made to carry the fact and the walk refuses to guess; then every name-list declaration states set or ordered, the order facet is emitted only for the ordered ones, the five set-valued order coordinates leave the kernel with representation-artifact verdicts, and a test makes an unmarked list arrive failing rather than silent'
