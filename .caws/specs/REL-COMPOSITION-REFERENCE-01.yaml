id: REL-COMPOSITION-REFERENCE-01
title: 'The independently derived lawful set covers the composition task: it receives the partition and derives the additivity and key-channel conditions itself'
risk_tier: 2
mode: feature
lifecycle_state: draft
created_at: '2026-09-19T06:16:56.413Z'
updated_at: '2026-09-19T06:16:56.413Z'
created_by_session: 'session-81b74ef5-48d2-46ae-a53d-880593255530'
blast_radius:
  modules:
    - 'packages/ds-codegen/src/analytical/projection.ts (the independently derived lawful set and the partition admission it derives)'
    - 'packages/ds-codegen/src/analytical/projection.test.ts (the composition coverage controls)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/analytical'
  out: []
invariants:
  - 'A REFERENCE THAT CANNOT SEE A PREMISE CANNOT CHECK IT. The composition task turns on the declared partition, so a derivation that does not receive one is not a reference for that task however well it agrees on magnitude comparison.'
  - 'The additivity and key-channel conditions are DERIVED here from the declaration, not read off the enumerator. Stating the same law twice is the point of the comparison; calling the implementation would destroy it.'
  - 'An omitted partition leaves the lawful set UNESTABLISHED, which is not the same as empty by decision. The reference reports the obligation rather than returning a set it cannot justify.'
  - 'The coverage boundary is stated. A task the reference still does not receive premises for is recorded as uncovered rather than implied to be covered by a passing comparison.'
acceptance:
  - id: A1
    given: 'An admitted operation over the entered basis and a declared partition, for the composition task.'
    when: 'Both the enumerator and the independent derivation run.'
    then: 'given an admitted operation over the entered basis and a declared partition; when the composition task is enumerated and independently derived; then the two memberships are equal, and the reference received the partition'
  - id: A2
    given: 'A result whose measure is declared non-additive.'
    when: 'Both run over it.'
    then: 'given a measure declared non-additive; when composition is derived and enumerated; then the lawful set is empty with the corpus''s own cause in the reference and the enumerator refuses for the same reason'
  - id: A3
    given: 'A result whose measure is declared a ratio-measure.'
    when: 'Both run over it.'
    then: 'given a measure declared a ratio-measure; when composition is derived and enumerated; then the lawful set is empty in both, for the reason the declaration gives'
  - id: A4
    given: 'A measure declared semi-additive along one dimension, partitioned two ways.'
    when: 'Both run in each regime.'
    then: 'given a measure declared semi-additive; when the declared partition is one it is not additive along; then the lawful set is empty in both, and the same measure partitioned along a dimension it IS additive along is not emptied'
  - id: A5
    given: 'Composition with no declared partition.'
    when: 'Both run.'
    then: 'given composition with NO declared partition; when both run; then the lawful set is unestablished rather than empty by decision, and the reference names the obligation'
  - id: A6
    given: 'A result whose group column is a key.'
    when: 'Both run.'
    then: 'given a result whose group column is a key; when both run; then a non-positional dimension channel is lawful in neither'
  - id: A7
    given: 'The reference source and its recorded non-claims.'
    when: 'They are read.'
    then: 'given the reference; when its premises are read; then what it shares and what it derives are stated, and what it still does not cover is recorded'
non_functional: {}
