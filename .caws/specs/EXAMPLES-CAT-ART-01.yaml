id: EXAMPLES-CAT-ART-01
title: 'Typing cat: lighting, materials, cat anatomy and geometry refinement'
risk_tier: 3
mode: feature
lifecycle_state: active
worktree: cat-art
created_at: '2026-09-23T04:08:35.966Z'
updated_at: '2026-09-23T04:09:59.773Z'
created_by_session: '15bd2efa-0b44-4a06-8e50-d925effe6a05'
blast_radius:
  modules:
    - 'examples/spatial-console/web/src/cat'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'examples/spatial-console/web/src/cat'
    - 'examples/spatial-console/web/cat.html'
  out: []
invariants:
  - 'Paw contact targets (keyToWorld, trackpadToWorld, screenWorld) and screen plane placement are unchanged, so input->pose mapping and hit-test projection keep their meaning'
  - 'Device screen meshes stay unlit and excluded from tone mapping so DOM colours render exactly'
acceptance:
  - id: A1
    given: 'the cat page in flagged Chrome'
    when: 'it renders'
    then: >-
      the scene uses a PMREM environment map and tone mapping, device screens stay
      colour-exact (toneMapped false), and shadows are soft with a shadow camera
      framed to the visible desk
  - id: A2
    given: 'the cat'
    when: 'idle, typing, on the trackpad, or reaching the tablet or phone'
    then: >-
      it sits upright, set back from the laptop so its head stays below the main
      camera's line of sight to the trackpad, with shoulders at the front of the
      chest below the chin; each arm is a pole pinned at the shoulder socket and the
      wrist (socket and wrist gaps 0 in every pose) that stretches to wherever the
      paw goes, with a white sock at the wrist end; paws never reach outside a
      top-down box from the back row of keys to the back of the cat and out to the
      outermost tablet and phone corners, even when a pointer is dragged off a
      screen; while it leans to the tablet or phone the other paw rests at that
      side's trackpad corner and stays there; keys going to one device hold its
      attention for 800 ms against pointer moves over another device, and a held-off
      move is replayed when the hold ends; ears are parented to the head; it has a
      swaying tail and breathing
  - id: A3
    given: 'the laptop, tablet, phone and cup'
    when: 'rendered'
    then: >-
      the bodies use rounded-box geometry, the laptop has a hinge barrel, and the
      cup is a lathe with wall thickness and a handle
  - id: A4
    given: 'the desk texture'
    when: 'the page loads twice'
    then: >-
      the wood is byte-identical because it uses a seeded RNG, and it has plank end
      joints and per-plank variation
  - id: A5
    given: 'the changed scene'
    when: 'verify:cat runs against a dev server'
    then: 'every check passes'
non_functional: {}
contracts: []
