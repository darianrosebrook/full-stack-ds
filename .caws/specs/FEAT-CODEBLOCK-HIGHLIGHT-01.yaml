invariants:
  - 'CodeBlock code stays text-only end-to-end: highlighting emits spans with text children and never interprets or injects HTML from the source string.'
  - 'One canonical tokenizer source module, emitted byte-identical into every web framework package; no per-framework tokenizer divergence.'
  - 'Tokenization is pure, synchronous, and deterministic (SSR-safe): same input yields the same token stream on every target.'
  - 'Emitters lower highlighting from an IR content-transform fact only; no emitter branches on the CodeBlock component name.'
  - 'Token kinds remain a closed enum declared in the CodeBlock contract.'
acceptance:
  - id: A1
    given: 'the CodeBlock contract declares a highlight content transform, a token part, and a closed token-kind enum'
    when: 'pnpm run generate -- --target=all CodeBlock runs'
    then: 'all five web framework packages emit CodeBlock artifacts that render token spans for highlighted code and degrade to plain text when highlighting is disabled or the target does not realize it'
  - id: A2
    given: 'committed golden token fixtures for typescript, bash, json, and plaintext inputs'
    when: 'each web framework package tokenizer test runs'
    then: 'all five produce identical token streams bounded by the contract token-kind enum'
  - id: A3
    given: 'the updated corpus and emitted artifacts'
    when: 'pnpm run generate:check and pnpm run governed:rail run'
    then: 'no DRIFT or RAIL diagnostics fire and regenerated bytes match committed output'
  - id: A4
    given: 'the new IR content-transform fact'
    when: 'emitters lower it'
    then: 'no emitter branches on the CodeBlock component name and the no-component-name-lore gate stays green'
  - id: A5
    given: 'HTML-injection-shaped code input'
    when: 'the component renders in any framework'
    then: 'the source is never interpreted as markup and copied text round-trips the input'
non_functional: {}
