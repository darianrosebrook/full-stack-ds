acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a contracts directory whose form-region file has been REMOVED; when the search runs over the same basis; then its normalized outcome is identical to the real one, and the region loader throws on that directory so the removal is real rather than nominal'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a contracts directory whose regions are renamed and whose assertions are blanked; when the catalogue is generated and the search runs; then the catalogue differs and the normalized search outcome is identical'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the comparison; when it is read; then the normalized outcome is the FULL one - population, support, retained membership, every refusal with its cause and every undecided with its obligation - not membership alone'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the removed directory; when the catalogue path is exercised; then it fails while the search does not, which is what makes the layer''s consumption observable at all'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the projected module; when the functions the search is built from are read; then none of them names the region loader'
non_functional: {}
