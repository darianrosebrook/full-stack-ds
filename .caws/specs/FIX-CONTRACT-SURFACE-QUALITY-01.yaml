id: FIX-CONTRACT-SURFACE-QUALITY-01
title: 'Repair contract-level surface defects: Card status rail, Popover border/surface, Divider UA leak, Table selected contrast'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-02T23:16:49.100Z'
updated_at: '2026-09-02T23:16:49.100Z'
blast_radius:
  modules:
    - 'ds-contracts'
    - 'ds-react'
    - 'ds-vue'
    - 'ds-svelte'
    - 'ds-angular'
    - 'ds-lit'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-contracts/components/Card'
    - 'packages/ds-contracts/components/Popover'
    - 'packages/ds-contracts/components/Divider'
    - 'packages/ds-contracts/components/Table'
    - 'packages/ds-react/src'
    - 'packages/ds-vue/src'
    - 'packages/ds-svelte/src'
    - 'packages/ds-angular/src'
    - 'packages/ds-lit/src'
    - 'packages/ds-react-native/src'
  out: []
invariants:
  - 'A variant-only decoration (status rail, accent stripe) is never declared in a base/root style block; it lives only in the variant selector that motivates it'
  - 'Two edges of one visual outline never resolve through different semantic token families'
  - 'A contract whose host element carries UA border defaults (hr, button, input, fieldset) explicitly neutralizes every edge it does not itself style'
  - 'Any style block that sets a background from an accent/intent token also sets its paired foreground, so text contrast is not left to inheritance'
  - 'Generated artifacts are regenerated and committed in the same commit as the contract change that produced them'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a Card with no status prop; when rendered in any brand and theme; then all four borders are 1px and resolve through one token family with no 2px leading rail'
non_functional: {}
contracts:
  - name: 'component-styles'
    type: schema
    path: 'packages/ds-contracts/component.contract.schema.json'
