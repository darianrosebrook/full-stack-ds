id: FIX-SLOT-REQUIRED-OWNERSHIP-01
title: 'Preserve occurrence ownership in the required-region usage audit'
risk_tier: 2
mode: fix
lifecycle_state: active
created_at: '2026-09-19T18:45:52.868Z'
updated_at: '2026-09-19T18:46:35.053Z'
