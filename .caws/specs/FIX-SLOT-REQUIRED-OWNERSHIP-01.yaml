blast_radius:
  modules:
    - 'ds-codegen-usage-composition'
    - 'showcase-usage-audit'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/usage-composition.ts'
    - 'packages/ds-codegen/src/usage-composition.test.ts'
    - 'src/lib/render-usage.test.tsx'
    - 'docs/current-implementation-snapshot.md'
  out: []
invariants:
  - 'A nested component root (an fsds.X node inside another occurrence''s children or slot content) is a new ownership context: nothing it supplies discharges the enclosing occurrence''s obligations.'
  - 'Part-ref delivery mirrors the renderer''s subcomponent routing: fsds.X.<region> delivers to the enclosing occurrence only when that occurrence''s component is X; a part ref under a different component renders an orphan subcomponent element and supplies nothing.'
  - 'The audit failure-message prefix [USAGE-REQUIRED-SLOT-MISSING] <Component>[<frame>] is retained so the existing catalog marker for card-actions-slot-required keeps matching without a catalog change.'
  - 'The flat collectSuppliedRegions walker is replaced in place — no dead code, no second region vocabulary; deriveRequiredRegionObligations and its narrowing semantics are unchanged.'
  - 'Component-owned anchors, generated-API requiredness, and runtime content inspection remain out of scope.'
acceptance:
  - id: A1
    given: 'a frame with an outer and an inner occurrence of the same component where only the inner occurrence supplies its required region'
    when: 'the ownership-aware violation finder runs'
    then: 'exactly the outer occurrence is reported with its component and tree path and the inner occurrence is not'
  - id: A2
    given: 'valid nested compositions where both occurrences supply their regions, and the live corpus including nested occurrences'
    when: 'the audit runs'
    then: 'zero violations and the sweep still observes real obligations'
  - id: A3
    given: 'the catalog mutant card-actions-slot-required at the landed HEAD with no catalog change'
    when: 'the targeted full-profile mutation measurement runs'
    then: 'it is still detected at root-tests with the retained marker prefix'
non_functional: {}
contracts:
  - name: 'slot-required-ownership'
    type: contract-test
    path: 'packages/ds-codegen/src/usage-composition.test.ts'
