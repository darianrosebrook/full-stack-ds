invariants:
  - 'No contract or schema change — the Switch/ToggleSwitch contracts already carry every native-toggle fact this slice lowers.'
  - 'The native-collapse emitter branch gates on the same native-toggle IR fact the swift collapse path consumes; no component-name literals enter the emitter.'
  - 'The emitted Kotlin compiles against the real org.jetbrains.compose (JVM) runtime artifacts — no hand-authored androidx stubs anywhere in the package.'
  - 'Explicit-only admission: jetpack-compose never enters --target=all output beyond the allowlisted set, governed:rail, or CI drift diffs until a default-admission spec lands.'
  - 'Generated trees for all other targets remain byte-identical.'
  - 'The Android ladder is declared, not implied: JVM real-runtime compile (rung 1, this spec) → full Android SDK + Gradle compile lane (rung 2, reserved follow-up) → runtime admission, Robolectric or instrumented (rung 3, reserved follow-up); each rung''s non-claims are recorded in builtin knownGaps and the snapshot.'
  - 'The golden''s line-67 ?? null-coalescing defect is corrected to the Kotlin elvis operator in emitted output; the golden stays the annotated prototype, never the shipped artifact.'
acceptance:
  - id: A1
    given: 'the Switch/ToggleSwitch native-toggle contracts and the hand-authored golden Switch.compose.kt'
    when: 'jetpack-compose is registered as an explicit-only builtin target and the native-collapse path is implemented'
    then: '--target=jetpack-compose emits both components as .kt into packages/ds-jetpack-compose with the golden controlled/uncontrolled channel hoisting and semantics mapping, correcting the golden line-67 ?? defect to the Kotlin elvis operator'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'the output package compiles against the real Compose runtime via Gradle Compose Multiplatform targeting the JVM — the declared falsification rung — with no hand-authored androidx stubs (compile exit 0)'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'explicit-only admission: --target=all and governed:rail emit nothing for jetpack-compose; the fsds.targets.json components allowlist gates full-corpus runs to Switch and ToggleSwitch while explicit requests bypass it, mirroring the swiftui registration'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'all other targets generated trees remain byte-identical and the existing gates pass: generate:check, root tests, governed:rail'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'the spec, builtin knownGaps, and snapshot record the declared Android ladder explicitly: this JVM real-runtime compile is rung 1 of 3; rung 2 (full Android SDK + Gradle compile lane) and rung 3 (runtime admission — Robolectric or instrumented) are reserved follow-up specs; named non-claims: no Android linking, Lint, or device execution, and JVM artifacts are not Android-compiled artifacts'
non_functional: {}
