id: RAIL-REDUCED-MOTION-01
title: 'Emit prefers-reduced-motion from the contract and rail declared motion against realization'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: reduced-motion
created_at: '2026-09-01T19:54:15.037Z'
updated_at: '2026-09-01T19:54:24.448Z'
blast_radius:
  modules:
    - 'packages/ds-codegen/src (contract.ts, ir.ts, css.ts)'
    - 'packages/ds-contracts/components (the 12 motion-declaring contracts)'
    - 'scripts/motion-realization-audit'
    - 'generated web component trees (ds-react, ds-vue, ds-svelte, ds-lit, ds-angular)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src'
    - 'packages/ds-contracts'
    - 'scripts/motion-realization-audit'
    - 'scripts/prepush-scope.mjs'
    - 'scripts/prepush-scope.test.mjs'
    - '.githooks/pre-push'
    - '.github/workflows/ci.yml'
    - 'packages/ds-react/src'
    - 'packages/ds-vue/src'
    - 'packages/ds-svelte/src'
    - 'packages/ds-lit/src'
    - 'packages/ds-angular/src'
  out: []
invariants:
  - 'A contract declaring motion.reducedMotion respect or disable emits a prefers-reduced-motion block neutralising its own animated declarations, in every admitted web family, derived from a governed IR fact rather than per-emitter lore.'
  - 'Every motion.transitions duration and easing reference either resolves in the token graph or is a ledger entry naming its owning spec; a dangling reference never renders a silent fallback unnoticed.'
  - 'The reduced-motion lowering is derived from the declarations actually emitted, so it cannot drift from the CSS it is meant to neutralise.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the 12 contracts declaring motion.transitions; when pnpm run audit:motion-realization runs; then every declared duration and easing reference is resolved against the token graph, and each of the 18 that currently dangle is either repaired in its contract or carried as a ledger entry naming its owning spec'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a contract declaring motion.reducedMotion respect or disable whose emitted CSS animates; when pnpm run generate -- --target=all runs; then all five web families emit a @media (prefers-reduced-motion: reduce) block neutralising exactly those animated declarations, derived from a MotionIR fact in ir.ts and lowered once in css.ts rather than per emitter'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the corpus today carries exactly one prefers-reduced-motion block and it lives in a hand-authored @custom region; when the audit runs after the lowering lands; then every component whose contract declares respect and whose CSS animates has a derived block, and any that does not is ledgered rather than silently unhonoured'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a contract mutated to carry a dangling easing reference, and a component whose derived reduced-motion block is suppressed; when node scripts/motion-realization-audit/selfcheck.mjs runs; then the rail fails naming each case, proving it can fail for the right reason'
non_functional: {}
contracts:
  - name: 'motion-ir'
    type: behavior
    path: 'packages/ds-codegen/src/ir.ts'
  - name: 'motion-realization-ledger'
    type: contract-test
    path: 'scripts/motion-realization-audit/selfcheck.mjs'
