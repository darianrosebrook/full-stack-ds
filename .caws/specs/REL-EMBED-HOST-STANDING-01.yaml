scope:
  in:
    - 'packages/ds-codegen/src/analytical'
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an embed whose host and whose embedded part are both retained programs; when the composite is judged; then it is retained and the host''s standing is on the record at its own path'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an embed whose host declares a task the relation path does not implement; when it is judged; then the embed is unsupported and attributed to the HOST, and the embedded part''s own disposition is still on the record'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an embed whose host''s operation the analytical rules contradict; when it is judged; then the embed is refused carrying the host''s own named cause and attributed to the host'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an embed whose host and whose embedded part are BOTH faulty; when it is judged; then both origins are on the record at distinct paths and neither erases the other'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an embed; when its record is read; then the host path is unambiguous against every part path, and the existing cell-budget controls are unchanged'
non_functional: {}
contracts:
  - name: 'embed-host-standing'
    type: behavior
    path: 'packages/ds-codegen/src/analytical/projection.ts'
