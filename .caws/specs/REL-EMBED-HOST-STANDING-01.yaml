id: REL-EMBED-HOST-STANDING-01
title: 'The embedded projection''s HOST is an operand: its standing is read, recorded at its own path, and affects the embed'
risk_tier: 2
mode: feature
lifecycle_state: active
created_at: '2026-09-19T06:00:11.845Z'
updated_at: '2026-09-19T06:00:30.394Z'
created_by_session: 'session-81b74ef5-48d2-46ae-a53d-880593255530'
blast_radius:
  modules:
    - 'packages/ds-codegen/src/analytical/projection.ts (the embed rule and the composite judgement read the host)'
    - 'packages/ds-codegen/src/analytical/projection.test.ts (the host standing controls)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
