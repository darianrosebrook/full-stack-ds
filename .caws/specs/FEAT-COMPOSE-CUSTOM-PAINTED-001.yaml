id: FEAT-COMPOSE-CUSTOM-PAINTED-001
title: 'Custom-painted Compose toggle: foundation-only substrate owned by the design system'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: compose-custom-painted
created_at: '2026-08-17T19:53:12.679Z'
updated_at: '2026-08-17T19:53:12.679Z'
