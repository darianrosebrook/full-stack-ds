id: EXAMPLES-SPATIAL-CONSOLE-01
title: 'Spatial console: generated web components as diegetic 3D-scene controls via HTML-in-Canvas'
risk_tier: 3
mode: feature
lifecycle_state: active
worktree: spatial-console
created_at: '2026-09-22T21:04:51.360Z'
updated_at: '2026-09-22T21:05:03.493Z'
created_by_session: '40ac09ec-5e89-4d7a-a01d-85b6bee26253'
blast_radius:
  modules:
    - 'examples/spatial-console'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'examples/spatial-console'
    - 'examples/README.md'
    - 'pnpm-lock.yaml'
    - 'package.json'
  out: []
invariants:
  - 'Panels import only public package exports (@full-stack-ds/react, /vue, /lit); no generated-file or renderer-internal imports'
  - 'Scene state is framework-neutral: panels and the 3D scene communicate through one lane-local store, never through each other'
  - 'No change to contracts, codegen, or generated packages'
acceptance:
  - id: A1
    given: 'Chrome launched with CanvasDrawElement enabled'
    when: 'the spatial console loads'
    then: 'React, Vue and Lit DS component panels render as textures on 3D panel meshes (pixel readback non-background)'
  - id: A2
    given: 'a panel mesh viewed at an oblique angle'
    when: 'a real pointer click lands on the projected screen position of a DS control'
    then: 'the control''s DOM handler fires and the bound scene property changes'
  - id: A3
    given: 'a scene-side change (object picked by raycast or animation tick)'
    when: 'the store updates'
    then: 'the readout panel''s DS components reflect the new value in their re-painted texture'
  - id: A4
    given: 'a browser without HTML-in-Canvas'
    when: 'the page loads'
    then: 'it shows an explicit unsupported notice naming the required flags rather than a blank scene'
non_functional: {}
contracts: []
