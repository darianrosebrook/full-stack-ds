invariants:
  - 'Typography lowering keys off IR facts (root details.role of content plus slot-name classification for text.size.* / text.typography.*), never per-component names.'
  - 'The typography role joins the claimed chrome-role set ONLY for content-role static roots (slot-evidence-gated), so the usage ratchet stays honest.'
  - 'Foundation-only: LocalFsdsTextStyle in the tokens runtime; generated code carries zero androidx.compose.material imports.'
  - 'Heading semantics derive from the union values of an element-tag designed prop (h1-h6), never from component identity.'
  - 'The parity gate stays two-directional and falsifiable; every added check is proven to fail on injection before it passes on regeneration.'
acceptance:
  - id: A1
    given: 'a content-role static root whose variant scopes carry typography slots'
    when: 'the composable emits'
    then: 'a TextStyle is assembled from the layered slots (fontSize from text.size.*, fontWeight from text.typography.fontWeight.*, lineHeight, letterSpacing) and provided to the content lambda through a foundation-only LocalFsdsTextStyle — the variant axes drive the type scale instead of being dead parameters.'
  - id: A2
    given: 'the parity gate'
    when: 'a content-role static component emits'
    then: 'the typography-role slots the RN <Name>.styles.ts consumes (text.size.*, text.typography.fontWeight.*, lineHeight, letterSpacing) are consumed by the Compose emission — usage parity extended from chrome to typography (Text 100%).'
  - id: A3
    given: 'an element-tag union designed prop (p/span/div/h1-h6)'
    when: 'a content-role root emits'
    then: 'h1-h6 lower to Modifier.semantics heading levels, general over the union values with no per-component names.'
  - id: A4
    given: 'the whole slice'
    when: 'gated'
    then: 'pnpm run governed:rail, pnpm test, pnpm run test:frameworks, node scripts/compose-parity-diff.mjs, docs:check-claims, and the gradle library plus settings example lane all pass and the generated trees are committed.'
  - id: A5
    given: 'the realization'
    when: 'documented'
    then: 'named non-claims record the limits — text-align/text-transform inheritance through a content-lambda TextStyle, font-family token absence (RN hardcodes its code font), and RN-only surface differences.'
non_functional: {}
contracts:
  - name: 'content-typography'
    type: behavior
    path: 'packages/ds-contracts/components/Text/Text.contract.json'
