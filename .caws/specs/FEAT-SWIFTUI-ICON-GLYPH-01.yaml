invariants:
  - 'The glyph host class keys on the IR iconGlyph fact (any component whose dom carries it emits through the same path); the catalog emission is data-driven from packages/ds-iconography with no per-icon emitter lore.'
  - 'SVGPath is hand-maintained runtime alongside FsdsTheme (like RN''s tokens/index.tsx); the arc→cubic conversion is the spike-validated endpoint parameterization.'
  - 'Decorative-by-default comes from catalog semantics, not emitter defaults; unknown glyph names are accessibility-surfaced, never silent blanks.'
acceptance:
  - id: A1
    given: 'the spike-validated SVG path kernel'
    when: 'shipped as hand-maintained runtime'
    then: 'Sources/DsSwiftUI/Glyphs/SVGPath.swift parses the catalog''s closed M/L/H/V/A/Z vocabulary with arc→cubic conversion, XCTested against real Alarm glyph bounds and relative/h/v forms'
  - id: A2
    given: 'the 29-icon iconography catalog'
    when: 'generation runs'
    then: 'GlyphCatalog.swift is generated (name→variants with viewBox+stroke data) and emitted through the shared-substrate channel alongside the Stack primitive; byte-stable across runs'
  - id: A3
    given: 'Icon (dom node carrying iconGlyph: nameFrom/sizeFrom with sm:16 md:20 lg:24 xl:32 hints)'
    when: 'generated'
    then: 'the glyph-host class emits Icon(name:size:) rendering the catalog glyph at the hinted size, decorative-by-default (accessibilityHidden per catalog semantics), unknown names surfaced through a11y (never silently blank); compiles'
  - id: A4
    given: 'the compositional-behavior direction'
    when: 'this slice lands'
    then: 'the glyph registry is a shared substrate (Badge/Status/Alert icon parts will lower through the same registry by iconGlyph facts, not per-component emission), and the presence-projection duplication across Dialog/Tooltip/Details/Sheet is recorded as the next compositional extraction'
  - id: A5
    given: 'the full worktree gate'
    when: 'typecheck, governed:rail, pnpm test, test:frameworks, swift test, swift build run'
    then: 'all pass; allowlist 19→20; remaining corpus fails loudly'
non_functional: {}
contracts:
