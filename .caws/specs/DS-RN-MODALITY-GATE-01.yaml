id: DS-RN-MODALITY-GATE-01
title: 'React Native Dialog/Sheet honor modal=false'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-23T04:23:59.975Z'
updated_at: '2026-09-23T04:23:59.975Z'
