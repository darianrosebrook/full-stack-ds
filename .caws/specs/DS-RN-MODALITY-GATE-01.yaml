  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen'
    - 'packages/ds-react-native'
    - 'packages/ds-contracts'
    - 'scripts/custom-region-audit/known-authored-regions.json'
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'a React Native Dialog or Sheet with modal={false}'
    when: 'it opens'
    then: 'the panel renders in-tree (no RN Modal host), with no backdrop, and is not an accessibility-modal view'
  - id: A2
    given: 'modal omitted or true'
    when: 'it opens'
    then: 'the panel renders inside RN Modal exactly as before'
  - id: A3
    given: 'the change'
    when: 'lint, generate:check, governed:rail, RN and root tests run'
    then: 'all pass, including eslint --max-warnings=0, and regenerated bytes are committed'
non_functional: {}
contracts:
  - name: 'rn-surface-modality'
    type: behavior
    path: 'packages/ds-codegen/src/frameworks/react-native/component-source.ts'
