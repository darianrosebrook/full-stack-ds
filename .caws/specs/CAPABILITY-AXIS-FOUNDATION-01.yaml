invariants:
  - 'Named component kinds remain semantic vocabulary, while shared machinery is selected from normalized axis facts rather than component names or kind allowlists.'
  - 'Form participation remains distinct from control value, commit, and field-association semantics.'
  - 'Existing generated surface behavior remains byte-equivalent unless an explicit contract correction is part of this slice.'
acceptance:
  - id: A1
    given: 'existing surface contracts'
    when: 'semantic IR is built and framework emitters route surface machinery'
    then: 'anchored behavior is selected from attachment and positioning axes without a tooltip/popover kind allowlist'
  - id: A2
    given: 'pilot Input Checkbox Switch ToggleSwitch and TextField contracts'
    when: 'contracts are validated and lowered'
    then: 'each declares a target part value model channel and commit semantic in form-control IR'
  - id: A3
    given: 'a pilot control consumes Field association'
    when: 'web output is emitted'
    then: 'id and aria-describedby attach to the declared control part rather than blindly to the component root, with the documented Lit shadow-boundary exception preserved'
  - id: A4
    given: 'textual pilot controls across the five web targets'
    when: 'the user edits a value'
    then: 'generated bindings use the contract-derived per-input commit timing without a Vue-only exception'
  - id: A5
    given: 'the capability-axis changes and regenerated artifacts'
    when: 'semantic validation governed admission and relevant runtime tests run'
    then: 'all required gates pass'
non_functional: {}
contracts:
  - name: 'capability-axis'
    type: schema
    path: 'packages/ds-contracts/component.contract.schema.json'
  - name: 'generated-control-binding'
    type: behavior
