invariants:
  - 'The gate derives its pair list mechanically from each contract''s styles.json/tokens.json binding chains (base scope plus variant slot redirections). It never accumulates hand-curated per-component pair lists; the curated-pair gate in ds-tokens stays the system-level contract and this gate is the component-level complement.'
  - 'The ledger only shrinks truthfully: an entry leaves only because its pair now passes or is no longer derived, enforced by the stale-entry DRIFT. Adding an entry to silence a regression introduced in the same change is forbidden.'
  - 'Disabled-state pairs are exempt per WCAG 1.4.3 Note 5; every other state (hover, focus, selected, variant scopes) is gated.'
  - 'The gate runs before emission: governed:rail runs generate:check before the generate step, so a failing pair blocks ds-framework output.'
acceptance:
  - id: A1
    given: 'a contract whose styles.json declares fg and bg color bindings'
    when: 'pnpm run generate:check runs'
    then: 'every derived pair is checked against WCAG AA 4.5:1 in light and dark themes of resolved.tokens.json and a failing pair reports DRIFT naming the tokens, themes, and ratios'
  - id: A2
    given: 'a pre-existing failing pair ledgered in component-contrast-known-gaps.json'
    when: 'generate:check runs'
    then: 'the ledgered pair reports no DRIFT, an unledgered new failure does, and a ledger entry that no longer reproduces reports DRIFT as stale'
  - id: A3
    given: 'styles blocks scoped to a disabled state'
    when: 'pairs are derived'
    then: 'they are exempt from the gate per WCAG 1.4.3 Note 5 and the exemption is documented on the validator'
  - id: A4
    given: 'the governed:rail script'
    when: 'it runs'
    then: 'generate:check executes before any ds-framework emission step'
  - id: A5
    given: 'resolved.tokens.json is not built'
    when: 'generate:check runs'
    then: 'the validator emits one instructional issue instead of crashing or silently passing'
non_functional: {}
contracts:
  - name: 'component-contrast-validator'
    type: behavior
