invariants:
  - 'SEQUENCING DECISION, recorded at entry: this slice permits a bounded experiment against the current analytical basis while stage 2 remains UNRATIFIED. It does not ratify stage 2, does not adjudicate any unresolved census coordinate, and does not satisfy REL-VIEW-ALGEBRA-01''s acceptance. Experiment results are CONDITIONAL on the basis named here, and a successful projection result is NOT retrospective proof of coordinate necessity.'
  - 'The basis is identified with its ACTUAL admission evidence, not its provisional status: fixture FX_N_STOCK_SUM_ALONG_PRODUCT, relation stock with grain [product, date] declared, fields product (nominal), date (interval/instant), on_hand (ratio, semi-additive with nonAdditiveAlong [date]); its canonical judgment is admissible with zero diagnostics and zero obligations. The facts the projection rules consume are transformation (ratio for the measure, nominal for the dimension), additivity.kind and nonAdditiveAlong (which partitions may be summed), and the declared grain (which makes grain-dependent candidates decidable).'
  - 'A premise whose truth matters to a candidate is ESTABLISHED, carried as an OBLIGATION, or shown IRRELEVANT to that candidate. Provisional status is never a substitute: no candidate may be admitted by a note saying a premise''s ratification is pending.'
  - 'The candidate space ARISES from the declared projection choices and their constraints. An enumerator that accepts a catalogue of desired forms and checks their predicates is not this experiment, and form aliases remain downstream names that no layer below L4 reads.'
  - 'The observer must inspect the claims the actual projection PROGRAM induces - its assignments, baseline, ordering and structural choices - against independently justified expectations for the declared task. An observer that reads the candidate''s own preservedClaims declaration and reports success is the false pass this slice exists to prevent, and the sensitivity control (mutate one claim-bearing choice, leave the declared explanation unchanged) must separate the two.'
  - 'All control expectations are recorded BEFORE the enumerator''s results are read, and the retained artifact carries the actual normalized candidate SETS rather than counts, alongside the consumed inputs and each candidate''s reason.'
  - 'Non-claims carried from entry: no stage-2 closure, no completion of stage 3, no rendered or navigational behaviour, no cross-substrate claim, and no proof that a more elaborate lookup implementation could not mimic a finite test set. Generalization is pressured later by unfamiliar recombinations, not declared here.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given stage 2 is unratified and its census still carries unresolved coordinates; when a bounded experiment enumerates projections for one admitted analytical object; then the candidate universe arises from the product of declared projection choices and their constraints rather than from a catalogue of desired forms, no form name participates at any layer below L4, and the enumerated set is retained as actual programs with their consumed inputs and their admission, refusal or obligation reason'
  - id: A2
    given: 'The doctrine precommits four metamorphic controls for stage 3.'
    when: 'The enumerator is run over the frozen basis under each perturbation.'
    then: >-
      The expectations are recorded before the results are read and the run reports
      the ACTUAL membership delta for each: ratio to ordinal removes every candidate
      whose task-bearing assignment requires ratio capacity and preserves the
      nominal and ordinal compatible alternatives; grain declared to unknown removes
      candidates whose legality depends on grain, preserves candidates whose
      admissibility does not inspect grain, and carries the grain obligation;
      non-cyclic to cyclic adds at least one cyclic-capable assignment where the
      target inventory provides angle and removes no unrelated cartesian or tabular
      candidate; and the irrelevant semantic perturbation leaves the normalized set
      byte-identical.
  - id: A3
    given: 'An observer can read a candidate''s own preservedClaims declaration.'
    when: >-
      The strong observer instead derives claims from the actual projection program,
      and one claim-bearing choice is mutated while the declared explanation is left
      unchanged.
    then: >-
      The strong observer reports the disagreement and the declaration-reading
      observer does not, so the experiment cannot pass by inspecting its own
      certificate of success.
  - id: A4
    given: 'The experiment retains its result.'
    when: 'The artifact is read.'
    then: >-
      It carries the actual normalized candidate sets rather than counts, the
      consumed inputs, each candidate's admission, refusal or obligation reason, and
      the shared claims and explicit losses across the retained set, together with
      the non-claims that bound the result to the declared candidate universe.
