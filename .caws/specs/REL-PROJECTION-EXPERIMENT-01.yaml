evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "pnpm exec vitest run packages/ds-codegen/src/analytical (21 files / 903 tests, projection.test.ts contributing 23) and pnpm test (4124 tests), typecheck and lint green, governed:rail and test:frameworks green in the worktree on merge 1387c4d8. The A1 group asserts, over the live run: at least two structurally different lawful programs from the SAME fixed authority; every retained program keeps the task fixed and satisfies the channel capacity rules read from the module table; the DENYLIST CHECK, which strips the quarantined FORM_ALIASES table and all comments from projection.ts and then fails if any name in analytical-pack/form-names.json appears elsewhere in the module; and that every refusal cause the enumerator emits is a cause extractDoctrineDiagnostics finds in the doctrine catalogue. MEASURED: 42 retained, 57 refused, 0 undecided, 42 structurally distinct after the authority is frozen; refusal causes are REL_AREA_INTERVAL_SCALE 11, REL_BASELINE_RATIO_CLAIM 11, REL_CYCLIC_ANGLE_NONCYCLIC 4, REL_HUE_CARRIES_ORDER 16, REL_SEQUENTIAL_ON_NOMINAL 15, every one a catalogue cause. Dispositions are exhaustive and each refusal carries a non-empty detail, so no candidate is silently dropped. NON-CLAIM: no form name participates below L4 and the check is mechanical, but a denylist is a word list; the structural claim rests on the candidate space being a product of declared choices, not on the denylist alone."
    recorded_at: "2026-09-18T00:02:07.336Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "The expectations in PRECOMMITTED are a committed constant in projection.ts authored before the run, and the ledger records each beside the ACTUAL delta from runExperiment: ratio->ordinal removed 42 of 42 with every removed program task-bearing claim resting on the ratio scale, and preserved 0 with the VACUITY STATED (magnitude comparison requires ratio comparability, and every retained program derives it from the scale that went away, so no program serves the same declared task once the scale is ordinal); declared->unknown retained 10 of 42 and moved 32 to an obligation carrying grain:declared, which is the preserve/remove/carry triple the doctrine precommits; non-cyclic->cyclic added 2 angular assignments and removed 0, with BOTH sides on the ordinal dimension so the cyclic claim is the only fact that differs; irrelevant-perturbation left the normalized set identical at 42 programs. A FIFTH control, targeted-narrowing, was ADDED because the ratio->ordinal preservation limb measured vacuous for this task: it perturbs the dimension nominal->ordinal, removes 29 nominal-only dimension channels and preserves 13 programs, which is what shows the narrowing is targeted rather than blanket. Tests re-derive all of this from the enumerator independently of the ledger, and each perturbation is re-parsed through the relation schema so a perturbation that produced an ILLEGAL declaration would throw rather than be read as a semantic effect. NON-CLAIM: that the expectations were authored first is a procedural guarantee, not a repository-verifiable one; what the repository checks is that the reported delta equals the recorded expectation. Also an INTERPRETATION, flagged as such: treating the value-readback family as not inspecting grain (it makes no positional magnitude claim) is a modelling decision, not a doctrine sentence."
    recorded_at: "2026-09-18T00:02:17.100Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "inducedClaims derives a program claims from its own coordinate, channel assignment, baseline and the FIELDS SCALE; declarationObserver reads the program claims field instead. The control mutates one claim-bearing choice - the baseline, zero to truncated - and leaves the declared explanation untouched, then asserts the two observers disagree: declarationObserver reports ok true while programObserver reports ok false, and the ledger records observerControl {declared: true, derived: false} with inducedAfterMutation [aggregate-magnitude, difference-comparability, partition-membership] against a declared [ratio-comparability]. A second mutation (measure channel length to luminance, explanation unchanged) separates them the same way. The A3 test therefore fails if the ledger starts reporting the declaration, which is the false pass the slice exists to prevent. THIS CONTROL CAUGHT REAL DEFECTS EARLIER: the first run of the suite failed because inducedClaims ignored the field scale, so an ordinal measure on a position channel claimed ratio comparability, and because the dimension cyclic capability never reached the rules. NON-CLAIM: the observer is a bounded derivation over declared program structure, not a second general-purpose checker, and it reads the program rather than the rendered output, which does not exist yet."
    recorded_at: "2026-09-18T00:02:17.586Z"