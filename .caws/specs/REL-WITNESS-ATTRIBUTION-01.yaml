invariants:
  - "The rule reads the DIFFERENCE the collision is over, not the operation: an arrangement-only pair (same occupant multiset at one list slot) is refused for incidence because the arrangement is order's degree of freedom -- and the same pair stays admissible for order alone and for {incidence, order} jointly, since the owner is then named."
  - 'The rule is scoped to the measured instance (incidence claimed over an arrangement-only difference at a slot that carries an order facet); no unmeasured generality is built.'
  - 'No committed witness may be refused by the rule -- the round-33 sweep measured zero genuine hazards over committed pairs -- and a moved witness authority re-records every ledger with pins corrected, not deleted.'
