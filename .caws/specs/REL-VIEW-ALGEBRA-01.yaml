invariants:
  - 'The oracle is frozen: packages/ds-contracts/analytical-pack is scope.out and closure must show corpus.jsonl 86f2b03a9fe7affe, corpus-case.schema.json e961af232d3ede45, vocabulary.json 5bd9dfddab19dc33, form-names.json 0564902cf8d7d4ff and the doctrine catalogue+appendix 123e73dfc61ab2ab unchanged. If the engine cannot reproduce a case, the case wins until the user rules otherwise.'
  - 'A coordinate re-enters the kernel only with a necessity witness whose outcome comes from a stage-2 oracle case, neighbour, triad or holdout item - never from engine output. necessity.test.ts already refuses an unwitnessed kernel coordinate and must keep passing.'
  - 'Only coordinates a stage-2 adjudicable case DEMANDS may be re-admitted. Rate re-derivation (unit numerator/denominator) has no stage-2 case and stays not-yet-admitted until stage 3, notwithstanding that it was named as a pressure point before the corpus was consulted; the same test applies to every other removal in removals.json.'
  - 'Stage 1 must not regress: the stage-1 adjudicable set stays 19 cases / 15 diagnostics with its expected judgments, the Phase-A ledger still reproduces modulo recorded key rewrites, and any engines.ts edit forces the holdout ruleDigest to be re-derived by hand and re-recorded with a reason line.'
  - 'Scope stops below L4. No projection space, no channels, no enumerator, no alias catalogue: the seven stage-3 peer-projection cases and the two stage-5 ones stay not-yet-adjudicable, and an engine rule that fires on them is out of scope even if it would pass.'
