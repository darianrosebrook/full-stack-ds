invariants:
  - 'Heading interactivity is contract-governed: the heading renders as an anchor only when href is provided and as a static span otherwise (if / if:! dom guards) - no emitter special-casing for NavTree'
  - 'No component-name branches are added to any emitter; NavTree uses only corpus-proven IR facts (if-guards including the first ifNegated use, iconGlyph, children sentinel, compound subcomponents)'
  - 'Every nav-tree.* token slot declared in NavTree.tokens.json is consumed by a var(--fsds-nav-tree-*) in generated CSS and every resolvesTo carries a fallback'
  - 'Tree connector lines are web-only styles.json declarations (platforms web); React Native degrades to indentation'
acceptance:
  - id: A1
    given: 'the NavTree contract and sidecars under packages/ds-contracts/components/NavTree'
    when: 'pnpm -F @full-stack-ds/tokens build then pnpm run generate:check run'
    then: 'schema and cross-graph semantic validation pass with no DRIFT diagnostics'
  - id: A2
    given: 'a validated NavTree contract'
    when: 'pnpm run generate -- --target=all NavTree then pnpm run governed:rail run'
    then: 'all rail-admitted targets emit NavTree artifacts and the rail verifies in required mode'
  - id: A3
    given: 'generated NavTree output across framework packages'
    when: 'the six derived-obligation audits run'
    then: 'all pass with no new dead slots, unrealized declared behavior, or unresolved token references'
  - id: A4
    given: 'generated NavTree in all framework packages'
    when: 'pnpm test and pnpm run test:frameworks run'
    then: 'root and all framework suites pass including NavTree'
  - id: A5
    given: 'the showcase sidebar'
    when: 'grouped navigation is reworked onto NavTree'
    then: 'groups render as branches with connector lines, the active component link carries aria-current=page, and pnpm run build passes'
