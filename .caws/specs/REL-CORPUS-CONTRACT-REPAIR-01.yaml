id: REL-CORPUS-CONTRACT-REPAIR-01
title: 'Stage 0.5: repair the corpus contract so it cannot bias the stage-1 engine'
risk_tier: 3
mode: feature
lifecycle_state: active
created_at: '2026-09-02T19:33:23.821Z'
updated_at: '2026-09-02T19:33:25.224Z'
blast_radius:
  modules:
    - 'packages/ds-contracts/analytical-pack (schema v2: case/diagnostic split, verdict, stage, evidence; corpus rename; vocabulary)'
    - 'packages/ds-codegen/src/analytical (corpus-integrity: bijection, stage selector, obligation, doctrine-mention edge)'
    - 'docs/architecture/analytical-relation-doctrine.md (lifecycle reconciliation, relational structure, three-valued judgment, necessity witnesses, task/encoding intersection, diagnostic catalogue)'
  data_migration: false
