  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an erased image is not a source declaration; when quotient.ts and the canonicalizer type it; then neither casts it back to Fixture, and a departure from the source language is reported as sourceLanguageDeparture rather than counted as a defect'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a required leaf carries a coordinate; when that coordinate is erased; then the slot becomes a typed forgotten value and every sibling fact in the enclosing declaration survives unchanged'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given declaration deletion forgets more than the leaf that names it; when a plan requires it; then it is reachable only through an explicit holder-presence or composite-declaration operation, never as the primitive erasure of a leaf value'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the live coordinate population; when plans are derived; then every non-reference coordinate has exactly one plan, every deliberate no-plan coordinate carries a typed reason, and no plan exists without a coordinate'
  - id: A6
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the four required-leaf witnesses currently hold on schema-invalid images; when they are rerun under the quotient codomain; then each is re-decided on the new images and any standing change is reported as an adjudication finding rather than applied automatically'
  - id: A7
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given witness and closure evidence is bound to an erasureAuthorityDigest covering the plan registry, the plan compiler and executor source closure, the canonical quotient-image serializer, the quotient schema version, the ordering graph and the schema-derived locator machinery; when any of those inputs moves; then the evidence is rejected rather than silently re-read'
  - id: A8
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given footprint-derived classifications are population-sensitive while a witness is existential; when the specimen population moves; then classifications bound to footprintBasisDigest are rejected and witnesses bound only to erasureAuthorityDigest survive'
  - id: A9
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the legacy erasure freeze was taken over 84 fixtures; when legacy and new paths are compared; then the equivalence runs over the complete current population of 205 specimens - 90 corpus, 22 resolved stimuli, 93 synthesized - and every divergence is adjudicated individually rather than resolved in favour of the incumbent'
  - id: A10
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given commutation was previously sampled over 15 representative plans; when composition is checked; then all 9730 unordered plan pairs are evaluated across the specimen population, independent pairs commute, ordered pairs obey their declared edge, every witness and closure set yields a listing-order-independent canonical image, and a genuinely non-confluent plan set is refused as evidence rather than normalized through one implementation order'
