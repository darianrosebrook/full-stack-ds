    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a source fixture that validates against the relation contract schema; when every executable erasure plan is applied to it; then the resulting image validates against the quotient-image schema, so quotientLanguageInvalid is 0 across the whole specimen population'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an erased image is not a source declaration; when quotient.ts and the canonicalizer type it; then neither casts it back to Fixture, and a departure from the source language is reported as sourceLanguageDeparture rather than counted as a defect'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a required leaf carries a coordinate; when that coordinate is erased; then the slot becomes a typed forgotten value and every sibling fact in the enclosing declaration survives unchanged'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given declaration deletion forgets more than the leaf that names it; when a plan requires it; then it is reachable only through an explicit holder-presence or composite-declaration operation, never as the primitive erasure of a leaf value'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the live coordinate population; when plans are derived; then every non-reference coordinate has exactly one plan, every deliberate no-plan coordinate carries a typed reason, and no plan exists without a coordinate'
  - id: A6
