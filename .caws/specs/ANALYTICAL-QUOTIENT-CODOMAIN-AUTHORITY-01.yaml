invariants:
  - 'The terminal invariant is quotientLanguageInvalid == 0, NOT sourceLanguageDeparture == 0. An erasure image that cannot be parsed as an unmodified source declaration is often expected and is not by itself a defect: a compiler IR is not invalid because it does not parse as source. What must never happen is an image invalid in the language of quotient images.'
  - 'Deleting a required leaf must NOT delete its enclosing declaration. That repair is refused as the general rule: it forgets the whole semantic object rather than the named leaf, and it would convert the present subsumes-refinements result on assertion.aggregate.op into real sibling over-erasure. Declaration deletion stays reachable only through an explicit holder-presence or composite-declaration operation.'
  - 'No standing moves as a byproduct of the codomain change. Every witness or closure verdict that changes under quotient images is reported for adjudication with its old and new outcome; none is applied silently, and none is preserved merely because it is the incumbent.'
  - 'The digest is attribution, not correctness: the tests prove behavior, the digest proves the recorded verdicts still refer to that behavior. erasureAuthorityDigest must cover executor and compiler SOURCE, not only the declarative plan registry - the predecessor session found two defects (a slot written into existence, an array element deleted as a null hole) where the declarative plan was unchanged and the executor was wrong.'
  - 'The oracle stays frozen: packages/ds-contracts/analytical-pack is scope.out and closure must show corpus.jsonl 86f2b03a9fe7affe, corpus-case.schema.json e961af232d3ede45, vocabulary.json 5bd9dfddab19dc33, form-names.json 0564902cf8d7d4ff and the doctrine catalogue+appendix 123e73dfc61ab2ab unchanged.'
  - 'REL-VIEW-ALGEBRA-01 stays open and blocked on this spec, and two different acts on the same coordinates are kept apart. MIGRATION REEVALUATION - rerunning a witness on quotient images and recording its old and new outcome, which A6 requires - happens inside this spec and confers no standing by itself; a result may be negative or non-promoting, and restoring a previous tally is not a success condition. SUBTRACTION ADJUDICATION - deciding whether a coordinate is necessary and may be removed - is reserved for REL-VIEW-ALGEBRA-01: the three holder-presence coordinates, the 24 footprint dependency coordinates, join.cardinality and the four required-leaf witnesses receive no subtraction verdict until this spec merges. The earlier wording said only "are NOT adjudicated until this spec merges", which read as forbidding the reevaluation A6 mandates.'
  - 'A6 population is identity-based, not count-based: every witness listed in codomain-adjudications.json is rerun under the quotient codomain; each changed result and each affected standing is reported independently; no migration reevaluation itself confers or removes subtraction standing. The phrase ''the four required-leaf witnesses'' in A6 describes the population at authoring time and is not the acceptance object.'
  - 'A7 coverage is collective: witness and closure evidence is bound to the authority identity set (coordinateBasisDigest, erasureAuthorityDigest, witnessAuthorityDigest, quotientSchemaVersion, ruleDigest), which together cover the plan registry, the plan compiler and executor source closure, the canonical quotient-image serializer, the quotient schema version, the ordering graph and the schema-derived locator machinery. The locator machinery moves coordinateBasisDigest; ''erasureAuthorityDigest'' in A7 names the erasure cause, and the union is what the evidence is bound to. Closure evidence must carry the authority block it was verified under and be refused, not re-read, when any identity moves.'
  - 'A9 population is the complete population produced by the bound specimen authority at measurement time, with its membership digest and observed counts recorded in the evidence receipt. The counts in A9 (205 specimens: 90 corpus, 22 resolved stimuli, 93 synthesized) describe the population at authoring time and are not a target; replacing them with a later count is equally not the acceptance object.'
  - 'A10 pair basis is all unordered pairs in the bound executable-plan registry at measurement time, with the registry digest and observed pair count recorded in the evidence receipt (9730 over 140 plans at authoring time, not a target). Closure normalization plans belong to the executable-plan population. Saturated merge semantics (all and only connected member classes), listing-order independence of every live witness and closure set, and refusal of a genuinely non-confluent set at evidence admission are separate propositions the pair count does not stand in for.'
