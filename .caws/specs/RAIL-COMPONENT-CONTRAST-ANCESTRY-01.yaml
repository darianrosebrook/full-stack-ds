id: RAIL-COMPONENT-CONTRAST-ANCESTRY-01
title: 'Component-contrast gate: inheritance-aware color×background pairing'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: contrast-ancestry
created_at: '2026-08-17T15:33:40.303Z'
updated_at: '2026-08-17T15:33:40.303Z'
blast_radius:
  modules:
    - 'packages/ds-codegen/src/validation: component-contrast validator gains an ancestry-aware pairing rule (color-only blocks pair against the nearest declared ancestor background) + tests'
    - 'packages/ds-codegen/src/validation/component-contrast-known-gaps.json: may GROW for the first time since FIX-CONTRAST-DEBT-01 burned it empty — the wider lens derives pairs that were previously unmodeled, and genuinely failing ones get ledger entries naming this spec'
    - 'generate:check / governed:rail pre-emission: same wiring, wider derivation lens (corpus-wide effect, not CodeBlock-only)'
    - 'docs/current-implementation-snapshot.md: strengthen the content-transform row a11y non-claim once token pairs are gated'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/validation/component-contrast.ts'
    - 'packages/ds-codegen/src/validation/component-contrast.test.ts'
    - 'packages/ds-codegen/src/validation/component-contrast-known-gaps.json'
    - 'docs/current-implementation-snapshot.md'
  out: []
invariants:
  - 'Pairing stays mechanical from styles.json + anatomy: ancestry comes from anatomy.dom parent chains and BEM part resolution in selector keys — never component names, never hand-curated pair lists.'
  - 'Same-block fg×bg pairing semantics are unchanged; inheritance pairing fires only when a block declares color without a same-block background-color.'
  - 'The two-directional ledger ratchet is preserved: an unledgered failing pair is DRIFT, a ledger entry that stops reproducing is DRIFT. Entries added by this spec name it as owner — they record pre-existing debt surfaced by a wider derivation lens, not regressions introduced here.'
  - 'The DISABLED exemption (WCAG 1.4.3 Note 5) applies to inherited pairs exactly as to same-block pairs.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a contract whose styles declare a background on an ancestor element block and a color-only descendant element block; when deriveComponentContrastPairs runs; then the descendant color pairs against the nearest declared ancestor background while same-block fg×bg pairing is unchanged'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the CodeBlock contract with nine token-kind color blocks; when the gate runs; then all nine token colors are derived against the code-block root background in both themes and every failing pair is ledgered in component-contrast-known-gaps.json naming this spec — no unledgered failures, no stale entries'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the full corpus under the wider lens; when pnpm run generate:check runs; then the gate passes with newly-derived failing pairs fixed or ledgered to an owning spec, preserving the two-directional ratchet'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a part scope that overlays only the descendant part; when the ancestor background resolves; then it comes from the base binding unless the scope also targets the ancestor block, and disabled blocks/scopes stay exempt'
non_functional: {}
contracts:
  - name: 'component-contrast-validator'
    type: behavior
