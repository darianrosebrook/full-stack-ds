acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the pair fixture population; when the relation is qualified at its declared grain; then four distinct structured observations are recovered with their associated values'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a readable observation that falsifies a declared bounds relationship; when the qualified judgment runs; then REL_FIELD_BOUNDS_VIOLATED is carried for that observation and field, with no diagnostic for satisfying or unreadable observations'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the baseline, the cross-symbol swap and the margin-preserving perturbation; when each is produced through admission, selection and lowering; then the judgments distinguish all three from the evidence the path actually consumes'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the produced readback; when it is decoded; then the required tuples and associations are recovered without rows or evaluator access, and mutating an association in the artifact is detected'
  - id: A5
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a relation whose grain or bounds declaration is malformed; when the orchestration runs; then no artifact is produced'
  - id: A6
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a consistent rename of the relation, grain fields, participating fields, bounds references and rows, plus a row reorder; when the normalized result is compared; then it is equivalent modulo that rename and reorder'
  - id: A7
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a field declaring temporality; when the qualified result is built; then the declared kind is carried and an undeclared field carries none, with no duration or extent invented'
non_functional: {}
