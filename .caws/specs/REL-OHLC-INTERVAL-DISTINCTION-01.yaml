  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a control where the temporal column IS cyclic, when the same operation is enumerated, then the cyclic channel becomes available, so the refusal is about interval-ness and not about the channel being unusable'
