    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the FX_P_OHLC relation and an operation this evaluator CAN perform over one of its co-registered ratio measures, when the result is enumerated, then the projection layer reaches it and its disposition is recorded'
  - id: A2
    given: 'The spec implementation is complete.'
