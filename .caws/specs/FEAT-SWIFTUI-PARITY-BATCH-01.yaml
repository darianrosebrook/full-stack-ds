id: FEAT-SWIFTUI-PARITY-BATCH-01
title: 'Parity batch 1: static/div-root content, prop-text, media, expandable, popover, skeleton, smoke harness (25→38)'
risk_tier: 2
mode: feature
lifecycle_state: active
created_at: '2026-08-17T04:56:06.277Z'
updated_at: '2026-08-17T04:56:06.277Z'
blast_radius:
  modules:
    - 'packages/ds-codegen/src/frameworks/swift/swiftui (class widenings + 4 new classes + popover row)'
    - 'packages/ds-swiftui (13 new components + smoke harness)'
    - 'fsds.targets.json + docs'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src'
    - 'packages/ds-swiftui'
    - 'fsds.targets.json'
    - 'docs/current-implementation-snapshot.md'
  out: []
invariants:
  - 'Every new class gates on IR facts (root tag family, children-leaf count, content binding kind, channel trio, surface kind); no component identity; unrealized props omitted-and-documented.'
  - 'The smoke harness must exercise every allowlisted component by name-list derived from the allowlist — a new admission that is not smoke-tested fails the harness''s completeness assertion.'
acceptance:
  - id: A1
    given: 'the widened static-content class (any passive root tag, wrapper elements allowed above a single children leaf)'
    when: 'Stat, ProfileFlag, Postcard, Breadcrumbs, NavList generate'
    then: 'all compile — content closure + presence-driven chrome + axes'
  - id: A2
    given: 'prop-text leaf class (root or code-part content bound to a string prop)'
    when: 'CodeSnippet and CodeBlock generate'
    then: 'they render the prop as monospaced text with chrome; compile'
  - id: A3
    given: 'media leaf class (img root with src/alt) and the src-or-fallback componentRef composition'
    when: 'Image and Avatar generate'
    then: 'Image lowers to AsyncImage(src) with alt via conditional a11y; Avatar renders Image when src else Text(name); both compile'
  - id: A4
    given: 'expandable content class (expanded boolean channel + content + lines/expandable props)'
    when: 'Truncate and ShowMore generate'
    then: 'content lineLimits to lines unless expanded, with a disclosure toggle Button when the contract authors one; compiles'
  - id: A5
    given: 'the popover surface kind and the decorative-box class (no children, no channels, passive root)'
    when: 'Popover and Skeleton generate'
    then: 'Popover emits through the ControllableValue substrate as a manual-open anchored surface (no hover); Skeleton emits chrome-only rounded box; AlertNotice admitted (already emits); all compile'
  - id: A6
    given: 'a body-evaluation smoke harness in the SwiftPM test target'
    when: 'swift test runs'
    then: 'EVERY admitted component instantiates and its body evaluates through NSHostingController without crashing — the kink-class the compile-only gates cannot see; plus full worktree gates green and --target=all byte-stable'
non_functional: {}
contracts:
  - name: 'swiftui-parity-smoke'
    type: contract-test
    path: 'packages/ds-swiftui/Tests/DsSwiftUITests/ComponentSmokeTests.swift'
