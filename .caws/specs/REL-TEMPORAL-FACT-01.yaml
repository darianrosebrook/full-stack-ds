acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an admitted operation whose group or measure field declares temporality; when the projection facts are derived; then the temporality kind is carried on the facts'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given two otherwise identical admitted operations whose group fields differ only in temporality kind; when their projection facts are compared; then the facts differ and the difference is attributable to temporality alone'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a field that declares no temporality; when the projection facts are derived; then no temporal fact is asserted rather than a default being invented'
