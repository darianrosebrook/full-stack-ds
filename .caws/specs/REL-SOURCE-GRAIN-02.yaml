invariants:
  - 'STANDING CONSERVATION: unreadable participating evidence leaves the qualification unproven with a named evidence gap and is never observationally equivalent to a verified population; changing evidence availability alone moves only the standing and evidence facts.'
  - 'DIAGNOSTIC SCOPE: a bounds violation names the bounded relationship and its own observation''s structured grain key; no observation''s fact implicates another observation, another field, or the task.'
  - 'ONE OBJECT: selection consumes the qualified result and lowering consumes the selection; the path never re-reads source rows or re-runs qualification; no artifact exists off the selected path.'
  - 'SUPPORT IS A DECLARED-LOWERING FACT: selection distinguishes lawful-but-unsupported, selected, and nothing-to-realize from the declared lowering set and the request, never from observation count.'
  - 'AUTHORITY LOCATION: the qualified path''s diagnostic is governed by codes.ts and the qualified-result contract, not the corpus doctrine catalogue, and that location is stated where the vocabulary is declared.'
acceptance:
  - id: A1
    given: 'the baseline, cross-symbol-swap, margin-preserving-perturbation and unreadable-participant populations'
    when: 'each population is qualified at the declared grain'
    then: 'standings are qualified, contradicted, contradicted and unproven respectively, with the unreadable participant carried as a named evidence gap and no bounds violation'
  - id: A2
    given: 'a population where one observation falsifies a declared bounds relationship and other observations satisfy it'
    when: 'the judgment is formed and the artifact decoded'
    then: 'each violation names the bounded relationship and its structured observation key, and no unrelated observation decodes as contradicted'
  - id: A3
    given: 'a qualified result with observations and a request for an intent no declared lowering serves, and a zero-observation result with the declared intent'
    when: 'program selection runs'
    then: 'the first is lawful-but-unsupported, the second is nothing-to-realize, neither produces an artifact, and no selection outcome is derived from observation count alone'
  - id: A4
    given: 'the qualified-result orchestration'
    when: 'a readback artifact is produced'
    then: 'it is produced only by lowering a selected program, and no lower entry point accepts an unselected request'
  - id: A5
    given: 'a qualified result whose source population rows are mutated after qualification'
    when: 'the orchestration lowers it'
    then: 'the artifact is identical to the pre-mutation lowering, because the selected program consumed the qualified result and never re-read or re-judged the rows'
  - id: A6
    given: 'the produced readback artifact alone'
    when: 'the output-only decoder runs'
    then: 'it recovers the structured grain bindings, admitted values, declared bounds facts and scoped standing, equal to the qualified result''s content, and mutating an association or the standing in the artifact alters what is recovered'
  - id: A7
    given: 'a relation whose bounds reference or grain member names no field the relation declares'
    when: 'qualification runs'
    then: 'it refuses before any qualified result exists, and the refusal names the undeclared reference'
  - id: A8
    given: 'a consistent rename of the relation, grain fields, participating fields, bounds references and rows, plus a row reorder'
    when: 'the qualified results are compared'
    then: 'they are equivalent modulo that rename and reorder'
non_functional: {}
