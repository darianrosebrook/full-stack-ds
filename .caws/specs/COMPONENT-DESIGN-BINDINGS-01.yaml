  - 'Component semantics remain contract-owned; shared defaults are namespaced and layered; consumers can override without specificity escalation.'
acceptance:
  - id: A1
    given: 'component design decisions'
    when: 'property bindings are normalized'
    then: 'a closed shared vocabulary identifies anatomy, state, value source and consumers without requiring unused semantic tokens to be consumed'
  - id: A2
    given: 'token references and unset overrides'
    when: 'components render'
    then: 'compatible fallbacks preserve defaults and component scoped overrides affect their intended properties'
  - id: A3
    given: 'nested and adjacent components and shared box defaults'
    when: 'consumers override named properties'
    then: 'layered namespaced overrides work without leaking component values across instances'
  - id: A4
    given: 'the migrated corpus'
    when: 'generation, tests and browser verification run'
    then: 'binding controls are exercised and visual or behavioral regressions are fixed with explicit target proof limits'
non_functional: {}
contracts:
